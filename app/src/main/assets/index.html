<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Material 3 roles. Fallback = baseline scheme from Tally's indigo seed; replaced by the phone's
   dynamic (wallpaper) palette on Android 12+ via #dyn below. */
:root{
  --primary:#3A4DB8;--on-primary:#FFFFFF;--primary-container:#DEE0FF;--on-primary-container:#00105C;
  --secondary-container:#E0E1F9;--on-secondary-container:#181A2C;
  --tertiary:#76546E;--tertiary-container:#FFD7F1;--on-tertiary-container:#2D1228;
  --surface:#FBF8FF;--surface-low:#F5F2FA;--surface-container:#EFEDF4;--surface-high:#E9E7EF;--surface-highest:#E4E1E9;
  --on-surface:#1B1B21;--on-surface-variant:#45464F;--outline:#767680;--outline-variant:#C6C5D0;
  --spent:#BA1A1A;--spent-container:#FFDAD6;--on-spent-container:#410002;
  --got:#146C2E;--got-container:#A3F5A8;--on-got-container:#002106;
  --minus-bg:#FADCDD;--minus-fg:#9A4550;--plus-bg:#D3F0DC;--plus-fg:#2F6B45;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#BAC3FF;--on-primary:#08218A;--primary-container:#293CA0;--on-primary-container:#DEE0FF;
  --secondary-container:#424659;--on-secondary-container:#E0E1F9;
  --tertiary:#E5BAD8;--tertiary-container:#5C3D56;--on-tertiary-container:#FFD7F1;
  --surface:#131318;--surface-low:#1B1B21;--surface-container:#1F1F25;--surface-high:#2A292F;--surface-highest:#35343A;
  --on-surface:#E4E1E9;--on-surface-variant:#C6C5D0;--outline:#90909A;--outline-variant:#45464F;
  --spent:#FFB4AB;--spent-container:#93000A;--on-spent-container:#FFDAD6;
  --got:#88D990;--got-container:#005320;--on-got-container:#A3F5A8;
  --minus-bg:#4A3236;--minus-fg:#F6C1C6;--plus-bg:#2A4133;--plus-fg:#B5E4C1;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --primary:#BAC3FF;--on-primary:#08218A;--primary-container:#293CA0;--on-primary-container:#DEE0FF;
  --secondary-container:#424659;--on-secondary-container:#E0E1F9;
  --tertiary:#E5BAD8;--tertiary-container:#5C3D56;--on-tertiary-container:#FFD7F1;
  --surface:#131318;--surface-low:#1B1B21;--surface-container:#1F1F25;--surface-high:#2A292F;--surface-highest:#35343A;
  --on-surface:#E4E1E9;--on-surface-variant:#C6C5D0;--outline:#90909A;--outline-variant:#45464F;
  --spent:#FFB4AB;--spent-container:#93000A;--on-spent-container:#FFDAD6;
  --got:#88D990;--got-container:#005320;--on-got-container:#A3F5A8;
  --minus-bg:#4A3236;--minus-fg:#F6C1C6;--plus-bg:#2A4133;--plus-fg:#B5E4C1;
  color-scheme:dark;}
</style>
<style id="dyn"></style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--surface);color:var(--on-surface);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;position:relative;overflow:hidden}
button:disabled{opacity:.38;cursor:default}
[hidden]{display:none!important}
/* state layer */
button::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:inherit}
@media (hover:hover){button:not(:disabled):hover::before{opacity:.08}}
button:not(:disabled):active::before{opacity:.12}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;display:block;flex:none}
main{max-width:520px;margin:0 auto;padding:0 16px 24px}
.muted{color:var(--on-surface-variant)}
.small{font-size:.85rem}
.spent{color:var(--spent)}.got{color:var(--got)}

/* top app bar */
.appbar{display:flex;align-items:center;gap:4px;height:64px;margin:0 -8px}
.appbar h1{font-size:1.35rem;font-weight:600;margin:0 0 0 4px;flex:1;letter-spacing:-.01em}
.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-variant);flex:none}
.pnav{display:flex;align-items:center;flex:1;min-width:0}
.plabel{height:40px;padding:0 12px 0 16px;border-radius:20px;font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:2px;letter-spacing:-.01em;white-space:nowrap}
.plabel .ic{width:20px;height:20px;color:var(--on-surface-variant)}

/* account balance strip */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.acc{flex:none;min-width:112px;max-width:180px;background:var(--surface-container);border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.acc .n{font-size:.78rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .b{font-weight:600;font-size:1rem;white-space:nowrap}
.acc.add{min-width:56px;align-items:center;justify-content:center;color:var(--on-surface-variant);background:transparent;border:1px dashed var(--outline-variant)}

/* morning check */
.check{background:var(--primary-container);color:var(--on-primary-container);border-radius:24px;padding:16px;margin:4px 0 8px}
.check h2{margin:0;font-size:1.1rem;font-weight:600}
.check p{margin:2px 0 10px;font-size:.9rem;opacity:.85}
.ckrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border-radius:12px;text-align:left}
.ckrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckrow b{font-weight:600;white-space:nowrap}
.ckrow .fx{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid currentColor;opacity:.8}
.check .btn{margin-top:10px;background:var(--primary);color:var(--on-primary)}

/* category ring */
.ring{position:relative;margin:4px -4px 0;touch-action:pan-y}
.ring.edit{margin:0 -4px;background:var(--surface-container);border-radius:20px}
.leaders{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:16px;min-width:0}
.cat .ci{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;border:2px solid}
.cat .cn{font-size:.72rem;color:var(--on-surface-variant);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cp{font-size:.72rem;font-weight:700;min-height:1em}
.dwrap{position:absolute;z-index:1;display:block;padding:0;border-radius:50%}
.dwrap::before{display:none}
.donut{width:100%;height:100%;display:block}
.rt{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 0 0;border-radius:16px;transition:left .2s,top .2s}
.rt .ci{width:var(--d);height:var(--d);font-size:calc(var(--d)*.5)}
.rt .cn,.rt .cp{font-size:var(--f);line-height:1.25}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dcenter .g{font-size:.9rem;font-weight:600;color:var(--got)}
.dcenter .s{font-size:1.2rem;font-weight:700;color:var(--spent);letter-spacing:-.01em;white-space:nowrap}
.dcenter .s.zero{color:var(--on-surface-variant);font-weight:600}
.dcenter .hint{font-size:.72rem;color:var(--on-surface-variant);max-width:100px;margin-top:2px}
.curbtn{pointer-events:auto;margin-top:4px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-high);color:var(--on-surface-variant)}

/* balance bar + fabs */
.balbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:20px;padding:14px 16px;text-align:left}
.balbar .l{flex:1;font-size:.9rem}
.balbar b{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.balbar .ic{opacity:.7}
.fabs{display:flex;align-items:center;justify-content:space-around;margin-top:18px}
.fab{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06)}
.fab .ic{width:36px;height:36px}
.fab.minus{background:var(--minus-bg);color:var(--minus-fg)}
.fab.plus{background:var(--plus-bg);color:var(--plus-fg)}
.fab.xfer{width:76px;height:64px;border-radius:20px;background:var(--surface-high);color:var(--on-surface-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600}
.fab.xfer .ic{width:26px;height:26px}

/* generic */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:24px;padding:0 20px;font-weight:600;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{background:transparent;color:var(--primary)}
.btn.danger{background:transparent;color:var(--spent);border:1px solid var(--outline-variant)}
.btn .ic{width:20px;height:20px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.gap{height:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--outline-variant);display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500;color:var(--on-surface-variant);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip[aria-pressed="true"]::after{content:"✓";font-size:.8rem}
.lbl{font-size:.8rem;font-weight:600;color:var(--on-surface-variant);margin:16px 0 8px}
.field{display:block;margin:12px 0 0}
.field>span{display:block;font-size:.8rem;font-weight:600;color:var(--on-surface-variant);margin-bottom:6px}
input,select{width:100%;height:52px;padding:0 14px;border:1px solid var(--outline);border-radius:12px;background:transparent;outline:none}
input:focus,select:focus{border:2px solid var(--primary);padding:0 13px}
input:focus-visible,select:focus-visible{outline:0}
select option{background:var(--surface-high);color:var(--on-surface)}
.amtwrap{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--primary);padding:4px 2px;margin-top:8px}
.amtwrap .cur{font-weight:600;color:var(--on-surface-variant);font-size:1.1rem}
.amtwrap input{border:0;height:64px;padding:0;font-size:2.4rem;font-weight:700;letter-spacing:-.02em}
.amtwrap input:focus{border:0;padding:0}
.amtwrap input:focus-visible{outline:0}
.amtwrap:focus-within{border-bottom-width:3px;margin-bottom:-1px}
.preview{font-size:.85rem;color:var(--on-surface-variant);background:var(--surface-high);border-radius:12px;padding:10px 12px;margin-top:12px}
.preview:empty{display:none}
.hint{font-size:.8rem;color:var(--on-surface-variant);margin:6px 2px 0}
.err{color:var(--spent)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.catgrid .cat[aria-pressed="true"] .ci{box-shadow:0 0 0 3px var(--surface-low),0 0 0 5px var(--primary)}
.catchip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 6px;border-radius:24px;background:var(--surface-high);font-weight:600}
.catchip .ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;border:2px solid}
.catchip .ic{width:18px;height:18px;color:var(--on-surface-variant);transition:transform .15s}
.catchip[aria-expanded="true"] .ic{transform:rotate(180deg)}

/* lists */
.list{background:var(--surface-container);border-radius:20px;overflow:hidden}
.day{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--on-surface-variant);padding:16px 8px 8px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-radius:0}
.tx+.tx{border-top:1px solid var(--outline-variant)}
.tx .em{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;flex:none;background:var(--surface-high)}
.tx .mid{flex:1;min-width:0}
.tx .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:.8rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap;text-align:right}
.tx.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.tx .em.pick{background:transparent;color:var(--primary)}
.tx .code{font-weight:700;width:44px;flex:none}
.tx>.ic{color:var(--primary)}
.tx .a small{display:block;font-weight:400;font-size:.75rem;color:var(--on-surface-variant)}
.empty{text-align:center;padding:28px 12px;color:var(--on-surface-variant)}
.sec{font-size:.85rem;font-weight:600;color:var(--primary);margin:24px 4px 8px}
.welcome{text-align:center;padding:48px 16px}
.welcome .big{font-size:3rem}
.welcome h2{font-size:1.4rem;margin:12px 0 6px}
.welcome p{color:var(--on-surface-variant);margin:0 0 24px}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface-container);border-radius:24px;padding:4px}
.month b{font-weight:600}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{flex:1;height:40px;font-weight:500;font-size:.9rem;border-radius:0}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.hero{text-align:center;padding:4px 0 8px}
.hero .t{font-size:.85rem;color:var(--on-surface-variant)}
.hero .v{font-size:2.2rem;font-weight:700;letter-spacing:-.02em}
.card{background:var(--surface-container);border-radius:20px;padding:16px;margin-top:12px}
.card h3{margin:0 0 4px;font-size:1rem;font-weight:600}

/* sheet, menu, snackbar */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:var(--surface-low);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,0,0,1)}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline-variant);margin:6px auto 10px}
.sheet .h{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:4px}
.sheet .h h2{margin:0;font-size:1.3rem;font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .p{animation:none}}
.pop{position:fixed;inset:0;z-index:15}
.menu{position:absolute;min-width:180px;background:var(--surface-container);border-radius:8px;padding:8px 0;box-shadow:0 2px 6px 2px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.3)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;text-align:left;border-radius:0}
.menu button[aria-checked="true"]{font-weight:600;color:var(--primary)}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--on-surface);color:var(--surface);min-height:48px;padding:6px 8px 6px 16px;border-radius:8px;font-size:.9rem;z-index:20;width:calc(100% - 32px);max-width:480px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.snack span{flex:1}
.snack button{color:var(--primary-container);font-weight:600;padding:8px 12px;border-radius:20px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.sheet.s2{z-index:12}
.s2 .p{height:88%}
.qbar{position:sticky;top:-8px;background:var(--surface-low);padding:4px 0 8px;z-index:2}
.fieldbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:52px;padding:0 10px 0 14px;border:1px solid var(--outline);border-radius:12px;text-align:left}
.fieldbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fieldbtn .ic{color:var(--on-surface-variant)}
/* settings category grids */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-container);border-radius:20px;padding:8px 4px}
.tile,.tx{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.placeholder{opacity:.25}
.ghost{position:fixed;z-index:30;pointer-events:none;transition:none;transform:scale(1.1);background:var(--surface-high);border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);margin:0}
.tile-add .ci{border:2px dashed var(--outline);color:var(--on-surface-variant)}
.cprev{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;border:2px solid;margin:0 auto 4px}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo-grid button{height:40px;border-radius:10px;font-size:1.3rem}
.emo-grid button[aria-pressed="true"]{background:var(--secondary-container)}
.dots{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface-low),0 0 0 4px var(--on-surface)}
/* period dialog */
.pop.scrim{background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface-high);border-radius:28px;padding:16px;width:100%;max-width:360px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dialog{animation:none}}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.cal-h b{font-weight:600}
.cal-wd,.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd span{text-align:center;font-size:.75rem;color:var(--on-surface-variant);padding:6px 0}
.wk{margin:2px 0}
/* the cell spans its column (so a range band joins up); the circle is a fixed 40x40 ::after */
.dd{height:40px;display:flex;align-items:center;justify-content:center;font-size:.9rem;border-radius:0;isolation:isolate;-webkit-user-select:none;user-select:none}
.dd::before{inset:0;margin:auto;width:40px;height:40px;border-radius:50%}
.dd::after{content:"";position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;z-index:-1}
.dd.other{color:var(--on-surface-variant)}
.dd.now{color:var(--primary);font-weight:600}
.dd.now::after{box-shadow:inset 0 0 0 1px var(--primary)}
.dd.in{background:var(--secondary-container);color:var(--on-secondary-container)}
.dd.rs{background:linear-gradient(90deg,transparent 50%,var(--secondary-container) 50%)}
.dd.re{background:linear-gradient(90deg,var(--secondary-container) 50%,transparent 50%)}
.dd.rs.re{background:none}
.dd.sel,.dd.rs,.dd.re{color:var(--on-primary)}
.dd.sel::after,.dd.rs::after,.dd.re::after{background:var(--primary);box-shadow:none}
.dd .dt{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.cal{touch-action:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mgrid button{height:48px;border-radius:24px;font-weight:500}
.mgrid button.now{box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary)}
.mgrid button.sel{background:var(--primary);color:var(--on-primary)}
.dlg-act{display:flex;justify-content:space-between;margin-top:12px}
.dlg-act .btn{width:auto}
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet"></div>
<div id="sheet2"></div>
<div id="pop"></div>
<div id="snack"></div>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CATS=[
 {id:"groceries",name:"Groceries",e:"🛒",c:"#2E9E6B",kind:"out"},
 {id:"food",name:"Eating out",e:"🍔",c:"#E08A2E",kind:"out"},
 {id:"transport",name:"Transport",e:"🚌",c:"#3A7BD5",kind:"out"},
 {id:"housing",name:"Rent",e:"🏠",c:"#8E5BD0",kind:"out"},
 {id:"bills",name:"Bills",e:"📱",c:"#D04E7C",kind:"out"},
 {id:"shopping",name:"Shopping",e:"🛍️",c:"#C9A227",kind:"out"},

/* Brings any saved state or backup (old or new format) to the current shape without changing any balance. */
function migrate(o){
  const s=blank();
  if(!o||typeof o!=="object")return s;
  Object.assign(s.settings,o.settings||{});
  s.accounts=(Array.isArray(o.accounts)?o.accounts:[]).filter(a=>a&&a.id).map(a=>({
    id:String(a.id),name:String(a.name||"Account"),type:TYPES[a.type]?a.type:"bank",
    currency:String(a.currency||s.settings.cur),opening:+a.opening||0,archived:!!a.archived}));
  if(Array.isArray(o.cats)){
    const valid=o.cats.filter(c=>c&&c.id&&c.name&&c.id!=="transfer");
    if(o.v>=2){
      s.cats=valid.map(c=>({id:String(c.id),name:String(c.name),e:c.e||"🏷️",c:c.c||"#9AA3B2",kind:c.kind==="in"?"in":"out",hidden:!!c.hidden}));
      CATS.forEach(d=>{if(!s.cats.some(c=>c.id===d.id))s.cats.push({...d});});
    }else{
      valid.filter(c=>!OLD_DEFAULT_IDS.includes(c.id)&&!CATS.some(d=>d.id===c.id))
        .forEach(c=>s.cats.splice(12,0,{id:String(c.id),name:String(c.name),e:c.e||"🏷️",c:c.c||"#9AA3B2",kind:"out"}));
    }
  }
  const okAcc=new Set(s.accounts.map(a=>a.id));
  s.txns=(Array.isArray(o.txns)?o.txns:[]).filter(t=>t&&t.id&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&isFinite(+t.amount)&&okAcc.has(t.account)).map(t0=>{
    const t={id:String(t0.id),ts:+t0.ts||0,date:t0.date,type:t0.type,amount:+t0.amount,account:t0.account,note:String(t0.note||"")};
    if(t0.type==="transfer"){
      t.to=t0.to;if(t0.toAmount!=null&&t0.toAmount!==""&&isFinite(+t0.toAmount))t.toAmount=+t0.toAmount;
      if(t0.feeId)t.feeId=t0.feeId;
    }else if(t0.type==="adjust"){
      /* signed amount, nothing else */
    }else if(t0.type==="expense"||t0.type==="income"){
      if(t0.cat==="transfer"){
        // v1 imported one-sided "own transfer" rows: keep their balance effect, never count as spending
        t.type="adjust";t.amount=t0.type==="expense"?-Math.abs(t.amount):Math.abs(t.amount);
        if(!t.note)t.note="Transfer (not tracked)";
      }else{
        let c=t0.cat||(t0.type==="income"?"income":"other");
        if(t0.type==="income"&&c==="family")c="gift";
        if(t0.type==="income"&&c==="other")c="otherin";
        t.cat=c;
        if(t0.feeOf)t.feeOf=t0.feeOf;
      }
    }else return null;
    return t;
  }).filter(Boolean);
  return s;
}

/* Account balances from starting balance + every entry. With `before`, only entries dated earlier (start of that day). */
function balances(before){
  const b={};S.accounts.forEach(a=>b[a.id]=+a.opening||0);
  S.txns.forEach(t=>{
    if(before&&t.date>=before)return;
    if(!(t.account in b))return;
    if(t.type==="expense")b[t.account]-=t.amount;
    else if(t.type==="income"||t.type==="adjust")b[t.account]+=t.amount;
    else if(t.type==="transfer"){b[t.account]-=t.amount;if(t.to in b)b[t.to]+=(t.toAmount!=null?t.toAmount:t.amount);}
  });
  for(const k in b)b[k]=r2(b[k]);
  return b;
}

function monthLabel(m,always){const [y,mo]=m.split("-").map(Number);const o={month:"long"};if(always||y!==new Date().getFullYear())o.year="numeric";return new Date(y,mo-1,1).toLocaleDateString(undefined,o);}

/* amount field: accepts "12.50", "12,50", and quick sums like "12+3.5" */
function evalAmt(v){
  let s=String(v??"").replace(/\s+/g,"");if(!s)return null;
  if(/^[-+]?\d+,\d{1,2}$/.test(s))s=s.replace(",",".");else s=s.replace(/,/g,"");
  if(!/^[-+]?(\d+\.?\d*|\.\d+)([-+](\d+\.?\d*|\.\d+))*$/.test(s))return null;
  let tot=0;s.replace(/([-+]?)(\d+\.?\d*|\.\d+)/g,(m,sg,n)=>{tot+=(sg==="-"?-1:1)*parseFloat(n);return m;});
  return r2(tot);
}

function hexRgb(h){h=String(h).replace("#","");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function rgbHex(c){return "#"+c.map(v=>pad(Math.round(v).toString(16))).join("");}
function tone(pal,t){
  for(let i=0;i<TONES.length-1;i++){const hi=TONES[i],lo=TONES[i+1];
    if(t<=hi&&t>=lo){const a=hexRgb(pal[i]),b=hexRgb(pal[i+1]),f=hi===lo?0:(hi-t)/(hi-lo);return rgbHex(a.map((v,k)=>v+(b[k]-v)*f));}}

}

const V={screen:"home",period:"day",anchor:today(),rs:null,re:null,cur:null,hMonth:today().slice(0,7),hAcc:"",showArchived:false,sel:null};
function range(){
  const a=V.anchor;
  if(V.period==="day")return [a,a];
  if(V.period==="range")return [V.rs,V.re];
  const m=a.slice(0,7),[y,mo]=m.split("-").map(Number);return [m+"-01",m+"-"+pad(new Date(y,mo,0).getDate())];
}
function periodLabel(){
  const t=today(),[s,e]=range();
  if(V.period==="day")return V.anchor===t?"Today":V.anchor===addDays(t,-1)?"Yesterday":dayLabel(V.anchor);
  if(V.period==="range"){
    if(s===e)return s===t?"Today":dayLabel(s);
    const a=parseISO(s),b=parseISO(e),mo=x=>x.toLocaleDateString(undefined,{month:"short"});
    return a.getDate()+(a.getMonth()!==b.getMonth()||a.getFullYear()!==b.getFullYear()?" "+mo(a):"")+" – "+b.getDate()+" "+mo(b);
  }
  return monthLabel(V.anchor.slice(0,7));
}
function shiftPeriod(n){
  if(V.period==="day")V.anchor=addDays(V.anchor,n);
  else if(V.period==="range"){
    const len=Math.round((parseISO(V.re)-parseISO(V.rs))/864e5)+1;
    V.rs=addDays(V.rs,n*len);V.re=addDays(V.re,n*len);
    if(V.re>today()){V.re=today();V.rs=addDays(V.re,1-len);}
    return;
  }
  else V.anchor=shiftMonth(V.anchor.slice(0,7),n)+"-01";
  if(V.anchor>today())V.anchor=today();
}

/* ---------- category ring around the donut (shared by Home and the Settings preview) ---------- */
/* Where n tiles go around the donut: evenly spaced (by arc length) on an oval that hugs the donut.
   Few categories → a circle of big tiles; more → smaller tiles on a slightly taller oval. Never an empty slot.
   Slots come back clockwise, starting just left of 12 o'clock. */
function ringLayout(n,W){
  const TWO=2*Math.PI,N=720;
  const oval=(a,b)=>{const pts=[],cum=[0];for(let k=0;k<=N;k++){const t=-Math.PI/2+k/N*TWO;pts.push([a*Math.cos(t),b*Math.sin(t)]);
    if(k)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));}return {pts,cum,P:cum[N]};};
  let u=92,a,b,O;
  for(;u>=44;u-=1){
    a=W/2-u/2;let ok=false;
    for(let k=1;k<=1.3001;k+=.05){b=a*k;O=oval(a,b);if(O.P/n>=u*.96){ok=true;break;}}
    if(ok)break;
  }
  if(!O)O=oval(a,b);
  const step=O.P/n,slots=[];
  for(let i=0;i<n;i++){
    let target=((n===1?0:(i-.5)*step)%O.P+O.P)%O.P,k=0;
    while(k<N&&O.cum[k+1]<target)k++;
    const f=(target-O.cum[k])/((O.cum[k+1]-O.cum[k])||1),x=O.pts[k][0]+(O.pts[k+1][0]-O.pts[k][0])*f,y=O.pts[k][1]+(O.pts[k+1][1]-O.pts[k][1])*f;
    slots.push({x:W/2+x,y:b+u/2+y});
  }
  const H=2*b+u,D=2*(Math.min(a,b)-.72*u);
  return {W,H,u,slots,cx:W/2,cy:H/2,D:Math.max(D,90)};
}
const TAU=2*Math.PI;
const circDist=(a,b)=>{const x=((a-b)%1+1)%1;return Math.min(x,1-x);};
/* point of a slice [start,start+w) (fractions of the circle) nearest to angle a, kept a little inside the slice */
function nearestInSlice(a,start,w){
  const e=Math.min(.01,w/2),rel=((a-start)%1+1)%1;
  if(rel>=e&&rel<=w-e)return a;
  return circDist(a,start+e)<circDist(a,start+w-e)?start+e:start+w-e;
}
let RE=null; /* the Settings preview's layout + order while it is on screen */
function ringHTML(cats,o){
  const home=o.mode==="home",W=Math.max(240,$("#app").clientWidth-24),L=ringLayout(Math.max(cats.length,1),W);
  const {u,D,cx,cy,H}=L,d=Math.round(u*(u<70?.5:.56)),f=Math.max(8,Math.min(11.5,u*.125));
  const pos=cats.map((c,i)=>{const s=L.slots[i];return {c,x:s.x,top:s.y-u/2,ix:s.x,iy:s.y-u/2+4+d/2,
    ang:((Math.atan2(s.y-cy,s.x-cx)/TAU+.25)%1+1)%1};});
  const tile=p=>{const v=home?(o.by[p.c.id]||0):0;
    return '<button class="cat rt'+(home?"":" tile")+'" style="left:'+(p.x-u/2).toFixed(1)+"px;top:"+p.top.toFixed(1)+"px;width:"+u.toFixed(1)+"px;height:"+u.toFixed(1)+"px;--d:"+d+"px;--f:"+f.toFixed(1)+'px" data-act="'+(home?"add-cat":"cat-edit")+'" data-v="'+esc(p.c.id)+'"'+(home?' aria-label="Add '+esc(p.c.name)+'"':"")+">"+
      '<span class="ci" style="'+ciStyle(p.c.c)+'">'+esc(p.c.e)+'</span><span class="cn">'+esc(p.c.name)+"</span>"+
      (home?'<span class="cp" style="color:'+p.c.c+'">'+(v?Math.max(1,Math.round(v/o.spent*100))+"%":"")+"</span>":"")+"</button>";};
  const R=40,C=2*Math.PI*R,Rout=D/2*.92; /* stroke outer edge: (40+6)/50 of the radius */
  let segs="",lines="",rot=-90;
  if(home&&o.spent>0){
    /* slices follow the tiles clockwise (not size), so leader lines never cross */
    const posOf=id=>pos.find(p=>p.c.id===id);
    const ent=Object.entries(o.by).filter(([,v])=>v>0).map(([id,v])=>({id,v,w:v/o.spent,p:posOf(id)}))
      .sort((a,b)=>(a.p?a.p.ang:2)-(b.p?b.p.ang:2));
    let off=0;ent.forEach(s=>{s.start=off;off+=s.w;});
    /* turn the whole donut so each slice sits as close as possible to its category, and never let two lines cross */
    const segCross=(p,q)=>{const o=(a,b,c)=>Math.sign((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
      return o(p[0],p[1],q[0])*o(p[0],p[1],q[1])<0&&o(q[0],q[1],p[0])*o(q[0],q[1],p[1])<0;};
    const linked=ent.filter(s=>s.p);
    let phi=0,bestCost=Infinity;
    for(let k=0;k<360;k++){const ph=k/360;let cost=0;
      const segs=linked.map(s=>{const a=nearestInSlice(s.p.ang,s.start+ph,s.w),dd=circDist(a,s.p.ang),th=a*TAU-TAU/4;cost+=dd*dd;
        return [[cx+Rout*Math.cos(th),cy+Rout*Math.sin(th)],[s.p.ix,s.p.iy]];});
      for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++)if(segCross(segs[i],segs[j]))cost+=10;
      if(cost<bestCost-1e-12){bestCost=cost;phi=ph;}}
    rot=phi*360-90;
    const gap=ent.length>1?1.4:0;
    ent.forEach(s=>{const len=s.w*C,l=Math.max(len-gap,.6);
      segs+='<circle r="'+R+'" cx="50" cy="50" fill="none" stroke="'+cat(s.id).c+'" stroke-width="12" stroke-dasharray="'+l.toFixed(2)+" "+(C-l).toFixed(2)+'" stroke-dashoffset="'+(-s.start*C).toFixed(2)+'"/>';
      if(!s.p)return;
      const a=nearestInSlice(s.p.ang,s.start+phi,Math.max(s.w-gap/C,.001)),th=a*TAU-TAU/4;
      const x1=cx+Rout*Math.cos(th),y1=cy+Rout*Math.sin(th),p=s.p;
      let x2,y2;
      const yb=p.top+u-2;
      const kb=y1>yb+2?(yb-y1)/(p.iy-y1):-1,xb=x1+(p.ix-x1)*kb;
      if(kb>0&&kb<1&&Math.abs(xb-p.x)<u/2-6){x2=xb;y2=yb;} /* coming up from below: stop under the labels */
      else{const dx=p.ix-x1,dy=p.iy-y1,Ln=Math.hypot(dx,dy)||1,rr=d/2+3;x2=p.ix-dx/Ln*rr;y2=p.iy-dy/Ln*rr;}
      if(Math.hypot(x2-x1,y2-y1)<4)return;
      const col=cat(s.id).c;
      lines+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="1.25" stroke-opacity=".85" stroke-linecap="round"/>'+
        '<circle cx="'+x1.toFixed(1)+'" cy="'+y1.toFixed(1)+'" r="2.2" fill="'+col+'"/>';
    });
  }
  const donut='<svg viewBox="0 0 100 100" class="donut" aria-hidden="true"><circle r="34" cx="50" cy="50" style="fill:var(--surface)"/><g transform="rotate('+rot.toFixed(2)+' 50 50)"><circle r="'+R+'" cx="50" cy="50" fill="none" style="stroke:var(--surface-highest)" stroke-width="12"/>'+segs+"</g></svg>";
  const box='left:'+(cx-D/2).toFixed(1)+"px;top:"+(cy-D/2).toFixed(1)+"px;width:"+D.toFixed(1)+"px;height:"+D.toFixed(1)+"px";
  let center;
  if(home){const cs=currencies();
    center='<button class="dwrap" data-act="entries" aria-label="See entries" style="'+box+'">'+donut+'<div class="dcenter">'+
      (o.got?'<div class="g">+'+esc(money(o.got,o.cur,true))+"</div>":"")+
      '<div class="s'+(o.spent?"":" zero")+'">'+esc(money(o.spent,o.cur,true))+"</div>"+
      (!o.spent&&!o.got?'<div class="hint">Tap a category to add</div>':"")+
      (cs.length>1?'<span class="curbtn" data-act="cur-next" role="button">'+esc(o.cur)+" ⇄</span>":"")+"</div></button>";}
  else{RE={L,order:cats.map(c=>c.id)};
    center='<div class="dwrap" style="'+box+'">'+donut+'<div class="dcenter"><div class="hint">Spending</div></div></div>';}
  return '<div class="ring'+(home?"":" edit")+'"'+(home?' id="ring"':"")+' style="height:'+H.toFixed(1)+'px">'+
    '<svg class="leaders" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+'" viewBox="0 0 '+W.toFixed(1)+" "+H.toFixed(1)+'" aria-hidden="true">'+lines+"</svg>"+
    center+pos.map(tile).join("")+"</div>";
}
function txLine(t){
  const a=acc(t.account),cur=a?a.currency:S.settings.cur;
  let em,emStyle="",d,s,amt,cls="";
  if(t.type==="transfer"){const to=acc(t.to);em="🔁";d=t.note||"Transfer";s=(a?a.name:"?")+" → "+(to?to.name:"?");
    amt=esc(money(t.amount,cur))+(t.toAmount!=null&&to&&to.currency!==cur?"<small>→ "+esc(money(t.toAmount,to.currency))+"</small>":"");}
  else if(t.type==="adjust"){em="⚖️";d=t.note||"Balance fix";s="Balance fix · "+(a?a.name:"?");amt=esc(signed(t.amount,cur));cls="muted";}
  else{const k=cat(t.cat),out=t.type==="expense";em=k.e;emStyle=' style="background:'+k.c+'1F"';d=t.note||k.name;s=k.name+" · "+(a?a.name:"?");
    amt=(out?"−":"+")+esc(money(t.amount,cur));cls=out?"spent":"got";}
  const selMode=!!V.sel&&V.screen==="history",on=selMode&&V.sel.has(t.id);
  return '<button class="tx'+(on?" on":"")+'" data-act="'+(selMode?"sel-toggle":"tx-open")+'" data-v="'+t.id+'"'+(selMode?' aria-pressed="'+on+'"':"")+">"+
    '<span class="em'+(selMode?" pick":"")+'"'+(selMode?"":emStyle)+">"+(selMode?ic(on?"checked":"unchecked"):esc(em))+'</span><span class="mid"><div class="d">'+esc(d)+'</div><div class="s">'+esc(s)+'</div></span><span class="a '+cls+'">'+amt+"</span></button>";
}
const byNewest=(a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0);
function dayGroups(list){
  let h="",cur="";
  list.forEach(t=>{
    if(t.date!==cur){if(cur)h+="</div>";cur=t.date;
      const sp={};list.forEach(x=>{if(x.date===cur&&x.type==="expense"){const c=(acc(x.account)||{}).currency;sp[c]=(sp[c]||0)+x.amount;}});
      const tot=Object.entries(sp).map(([c,v])=>"−"+money(r2(v),c)).join(" · ");
      h+='<div class="day"><span>'+esc(dayLabel(t.date))+"</span><span>"+esc(tot)+'</span></div><div class="list">';}
    h+=txLine(t);});
  return cur?h+"</div>":h;
}
function historyList(){
  let list=S.txns.filter(t=>t.date.slice(0,7)===V.hMonth);
  if(V.hAcc)list=list.filter(t=>t.account===V.hAcc||t.to===V.hAcc);
  return list.sort(byNewest);
}

  const list=historyList();let h;
  if(V.sel){const n=V.sel.size;

      '<button class="icon" data-act="sel-all" aria-label="Select all">'+ic("selectall")+"</button>"+
      '<button class="icon" data-act="sel-del" aria-label="Delete selected"'+(n?"":" disabled")+">"+ic("delete")+"</button></header>";
  }else h='<header class="appbar"><button class="icon" data-act="home" aria-label="Back">'+ic("back")+"</button><h1>History</h1>"+

  const accs=S.accounts.filter(a=>!a.archived||a.id===V.hAcc);
  if(accs.length>1)h+='<div class="strip" style="margin-top:8px"><button class="chip" data-act="hacc" data-v="" aria-pressed="'+(!V.hAcc)+'">All</button>'+accs.map(a=>'<button class="chip" data-act="hacc" data-v="'+a.id+'" aria-pressed="'+(V.hAcc===a.id)+'">'+esc(a.name)+"</button>").join("")+"</div>";
  if(!list.length)return h+'<div class="empty">Nothing written down this month.</div>';

}

}

    h+='<button class="cat tile" data-act="cat-edit" data-v="'+esc(c.id)+'"><span class="ci" style="'+ciStyle(c.c)+'">'+esc(c.e)+'</span><span class="cn">'+esc(c.name)+"</span></button>";
  });

}

    '<button class="btn tonal" data-act="export">Export entries (CSV)</button><div class="gap"></div>'+
    '<button class="btn danger" data-act="wipe">Delete all data</button>';

function pdRender(){
  const el=$("#pd");if(!el)return;const t=today(),tm=t.slice(0,7);
  let h='<div class="seg">'+[["day","Day"],["range","Range"],["month","Month"]].map(([k,l])=>'<button data-act="pd-tab" data-v="'+k+'" aria-pressed="'+(PD.tab===k)+'">'+l+"</button>").join("")+"</div>";
  if(PD.tab==="month"){
    h+='<div class="cal-h"><button class="icon" data-act="pd-year" data-v="-1" aria-label="Previous year">'+ic("left")+"</button><b>"+PD.year+'</b><button class="icon" data-act="pd-year" data-v="1" aria-label="Next year"'+(PD.year>=+t.slice(0,4)?" disabled":"")+">"+ic("right")+"</button></div>";
    h+='<div class="mgrid">'+Array.from({length:12},(_,i)=>{const m=PD.year+"-"+pad(i+1);
      const cls=[V.period==="month"&&V.anchor.slice(0,7)===m?"sel":"",m===tm?"now":""].join(" ").trim();
      return '<button class="'+cls+'" data-act="pd-month" data-v="'+m+'"'+(m>tm?" disabled":"")+">"+esc(new Date(PD.year,i,1).toLocaleDateString(undefined,{month:"short"}))+"</button>";}).join("")+"</div>";
  }else h+=calendar()+(PD.tab==="range"?'<p class="hint" id="pd-hint" style="text-align:center">'+(PD.pick?"Now tap the end day":"Drag across days, or tap start then end")+"</p>":"");
  h+='<div class="dlg-act"><button class="btn text" data-act="pd-today">Today</button><button class="btn text" data-act="pd-close">Cancel</button></div>';
  el.innerHTML=h;
}
function calendar(){
  const t=today(),m=PD.month,[y,mo]=m.split("-").map(Number),first=m+"-01";
  const off=(parseISO(first).getDay()+6)%7,rows=Math.ceil((off+new Date(y,mo,0).getDate())/7);
  const has=new Set(S.txns.map(x=>x.date)),rg=PD.tab==="range";
  const hs=rg?(PD.pick||(V.period==="range"?V.rs:null)):null,he=rg?(PD.pick||(V.period==="range"?V.re:null)):null;
  let h='<div class="cal-h"><button class="icon" data-act="pd-mon" data-v="-1" aria-label="Previous month">'+ic("left")+"</button><b>"+esc(monthLabel(m,true))+'</b><button class="icon" data-act="pd-mon" data-v="1" aria-label="Next month"'+(m>=t.slice(0,7)?" disabled":"")+">"+ic("right")+"</button></div>";
  h+='<div class="cal"><div class="cal-wd">'+Array.from({length:7},(_,i)=>"<span>"+esc(parseISO(addDays("2024-01-01",i)).toLocaleDateString(undefined,{weekday:"narrow"}))+"</span>").join("")+"</div>";
  let d=addDays(first,-off);
  for(let r=0;r<rows;r++){
    h+='<div class="wk">';
    for(let i=0;i<7;i++){
      const cls=["dd"];if(d.slice(0,7)!==m)cls.push("other");if(d===t)cls.push("now");
      if(!rg&&V.period==="day"&&d===V.anchor)cls.push("sel");
      if(hs&&d>=hs&&d<=he){if(d===hs)cls.push("rs");if(d===he)cls.push("re");if(d>hs&&d<he)cls.push("in");}

/* ---------- saving ---------- */
function saveTx(){
  const v=readVals(),amt=evalAmt(v.amount);
  if(!F.cat){snack("Pick a category");return;}
  if(!(amt>0)){snack("Enter an amount");return;}
  if(!acc(F.account)){snack("Pick an account");return;}
  if(!v.date){snack("Pick a date");return;}
  const t={type:F.type,amount:amt,account:F.account,cat:F.cat,date:v.date,note:(v.note||"").trim()};
  if(F.type==="income")S.settings.lastAccIn=F.account;else S.settings.lastAcc=F.account;
  const id=F.id;closeSheet();
  if(id)withUndo("Saved",()=>{const old=S.txns.find(x=>x.id===id);Object.assign(old,t);});
  else withUndo((t.type==="income"?"+":"−")+money(amt,acc(t.account).currency)+" · "+cat(t.cat).name,()=>{S.txns.push(Object.assign({id:newId(),ts:Date.now()},t));});
}
function saveTr(){
  const v=readVals(),fa=acc(F.from),ta=acc(F.to);
  if(!fa||!ta){snack("Pick both accounts");return;}
  if(F.from===F.to){snack("Pick two different accounts");return;}
  const amt=evalAmt(v.amount);if(!(amt>0)){snack("Enter the amount sent");return;}
  const diff=fa.currency!==ta.currency;let got=null;
  if(diff){got=evalAmt(v.toAmount);if(!(got>0)){snack("Enter how much arrived in "+ta.currency);return;}}
  const fee=F.showFee?(evalAmt(v.fee)||0):0;if(fee<0){snack("Fee can't be negative");return;}
  if(!v.date){snack("Pick a date");return;}
  const id=F.id,from=F.from,to=F.to,date=v.date,note=(v.note||"").trim();
  closeSheet();
  withUndo(id?"Saved":"Transferred "+money(amt,fa.currency)+" to "+ta.name,()=>{
    let t=id?S.txns.find(x=>x.id===id):null;
    if(!t){t={id:newId(),ts:Date.now()};S.txns.push(t);}
    const oldFee=t.feeId?S.txns.find(x=>x.id===t.feeId):null;
    Object.assign(t,{type:"transfer",amount:amt,account:from,to,date,note});
    if(diff)t.toAmount=got;else delete t.toAmount;
    if(fee>0){
      const f=oldFee||{id:newId(),ts:Date.now()};if(!oldFee)S.txns.push(f);
      Object.assign(f,{type:"expense",amount:r2(fee),account:from,cat:"fees",date,note:"Transfer fee",feeOf:t.id});
      t.feeId=f.id;
    }else{if(oldFee)S.txns=S.txns.filter(x=>x!==oldFee);delete t.feeId;}
  });
}
/* delete entries by id, keeping transfers and their fees consistent */
function deleteEntries(ids){
  ids=new Set(ids);
  S.txns.forEach(t=>{if(ids.has(t.id)&&t.feeId)ids.add(t.feeId);});
  S.txns=S.txns.filter(t=>!ids.has(t.id));
  S.txns.forEach(t=>{if(t.feeId&&ids.has(t.feeId))delete t.feeId;});
}

/* ---------- events ---------- */
/* a long-press or drag may end with a click from the same gesture; swallow it (reset by the next press, or after 1s) */
let swallowClick=false,swallowT=0;
function swallowNextClick(){swallowClick=true;clearTimeout(swallowT);swallowT=setTimeout(()=>{swallowClick=false;},1000);}
document.addEventListener("click",ev=>{
  if(swallowClick){swallowClick=false;ev.preventDefault();ev.stopPropagation();return;}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==="sheet-bg"){if(ev.target===el)closeSheet();return;}
  if(act==="sheet2-bg"){if(ev.target===el)closeSheet2();return;}
  if(act==="pop-bg"){if(ev.target===el)closePop();return;}
  if(el.tagName==="SELECT"||el.tagName==="INPUT")return;
  if(el.closest(".menu"))closePop();
  switch(act){
    case "home":V.screen="home";render();scrollTo(0,0);break;
    case "go":closeSheet();V.screen=v;render();scrollTo(0,0);break;
    case "menu":popup([["go","history","History"],["go","accounts","Accounts"],["go","settings","Settings"]],el);break;
    case "period-open":periodDialog();break;
    case "pd-tab":PD.tab=v;PD.pick=null;pdRender();break;
    case "pd-mon":PD.month=shiftMonth(PD.month,+v);pdRender();break;
    case "pd-year":PD.year+=+v;pdRender();break;
    case "pd-day":V.period="day";V.anchor=v;closePop();render();break;
    case "pd-rday":if(!PD.pick){PD.pick=v;pdRender();}else applyRange(PD.pick,v);break;
    case "pd-month":V.period="month";V.anchor=v+"-01";closePop();render();break;
    case "pd-today":V.period=PD.tab==="month"?"month":"day";V.anchor=today();closePop();render();break;
    case "pd-close":closePop();break;
    case "prev":shiftPeriod(-1);render();break;
    case "next":if(canNext()){shiftPeriod(1);render();}break;
    case "cur-next":{const cs=currencies();V.cur=cs[(cs.indexOf(viewCur())+1)%cs.length];render();break;}
    case "close":closeSheet();break;
    case "close2":closeSheet2();break;
    case "undo":if(undoFn){const f=undoFn;undoFn=null;f();}break;
    case "check-ok":S.settings.lastCheck=today();commit();snack("Page started for today");break;
    case "entries":entriesSheet();break;
    case "add-out":txSheet(null,"expense");break;
    case "add-in":txSheet(null,"income");break;
    case "add-cat":txSheet(null,"expense",v);break;
    case "tx-open":txSheet(v);break;
    case "f-showcats":{const g=$("#f-catgrid");g.hidden=!g.hidden;el.setAttribute("aria-expanded",String(!g.hidden));break;}
    case "f-cat":{
      F.cat=v;setPressed("f-cat",v);
      if(F.type!=="income"){const chip=$("#f-catchip");chip.innerHTML=catChipInner(cat(v));chip.hidden=false;chip.setAttribute("aria-expanded","false");
        $("#f-catgrid").hidden=true;$("#f-catlbl").hidden=true;focusAmt();}
      break;}
    case "f-acc":F.account=v;setPressed("f-acc",v);$("#amt-cur").textContent=acc(v).currency;break;
    case "tx-save":saveTx();break;
    case "tx-del":{const id=F.id;closeSheet();withUndo("Deleted",()=>deleteEntries([id]));break;}
    case "tr-new":trSheet();break;
    case "tr-from-acc":trSheet(null,v);break;
    case "tr-from":{F.from=v;if(F.to===v)F.to=[...$("#sheet").querySelectorAll('[data-act="tr-to"]')].map(b=>b.dataset.v).find(x=>x!==v);trSync();break;}
    case "tr-to":F.to=v;trSync();break;
    case "tr-swap":{const x=F.from;F.from=F.to;F.to=x;$("#f-toamt").value="";trSync();break;}
    case "tr-fee":F.showFee=true;$("#fee-wrap").hidden=false;el.hidden=true;$("#f-fee").focus();trPreview();break;
    case "tr-save":saveTr();break;
    case "tr-del":{const id=F.id;closeSheet();withUndo("Deleted",()=>deleteEntries([id]));break;}
    case "adj-del":{const id=F.id;closeSheet();withUndo("Fix deleted",()=>deleteEntries([id]));break;}
    case "acc-open":accOpen(v);break;
    case "fix-save":{
      const a=acc(F.id),val=evalAmt($("#f-actual").value);
      if(val==null){snack("Type what you have now");return;}
      const d=r2(val-balances()[F.id]);
      if(d===0){snack("Already matches");return;}
      const id=F.id;closeSheet();
      withUndo(a.name+" set to "+money(val,a.currency),()=>{S.txns.push({id:newId(),ts:Date.now(),type:"adjust",amount:d,account:id,date:today(),note:"Balance fix"});});
      break;}
    case "hist-acc":closeSheet();V.hAcc=v;V.hMonth=today().slice(0,7);V.screen="history";render();scrollTo(0,0);break;
    case "acc-form":accForm(v);break;
    case "f-type":F.type=v;setPressed("f-type",v);break;
    case "pick-acccur":curPicker(F.cur,c=>{if(F&&F.kind==="accf"){F.cur=c;$("#f-cur span").textContent=c;}});break;
    case "pick-maincur":curPicker(S.settings.cur,c=>{S.settings.cur=c;V.cur=null;commit();});break;
    case "cur-pick":{const f=CURPICK;closeSheet2();if(f)f(v);break;}
    case "acc-save":{
      const name=$("#f-name").value.trim();if(!name){snack("Give the account a name");return;}
      const raw=$("#f-open").value.trim(),o=raw?evalAmt(raw):0;
      if(o==null){snack("That balance isn't a number");return;}
      const data={name,type:F.type,currency:F.cur,opening:o};
      if(F.id)Object.assign(acc(F.id),data);else S.accounts.push(Object.assign({id:newId(),archived:false},data));
      const was=F.id;closeSheet();commit();snack(was?"Account saved":name+" added");break;}
    case "acc-arch":{const a=acc(F.id);a.archived=!a.archived;closeSheet();commit();snack(a.archived?a.name+" archived":a.name+" is back");break;}
    case "acc-del":{
      if(S.txns.some(t=>t.account===F.id||t.to===F.id))return;
      if(!confirm("Delete this account?"))return;
      S.accounts=S.accounts.filter(a=>a.id!==F.id);closeSheet();commit();break;}
    case "toggle-arch":V.showArchived=!V.showArchived;render();break;
    case "hmon":{const m=shiftMonth(V.hMonth,+v);if(m<=today().slice(0,7)){V.hMonth=m;if(V.sel)V.sel=new Set();render();}break;}
    case "hacc":V.hAcc=v;if(V.sel)V.sel=new Set();render();break;
    case "sel-start":V.sel=new Set();render();break;
    case "sel-cancel":V.sel=null;render();break;
    case "sel-toggle":if(V.sel.has(v))V.sel.delete(v);else V.sel.add(v);if(!V.sel.size)V.sel=null;render();break;
    case "sel-all":{const ids=historyList().map(t=>t.id),all=ids.every(id=>V.sel.has(id));V.sel=all?new Set():new Set(ids);render();break;}
    case "sel-del":{if(!V.sel||!V.sel.size)return;const ids=[...V.sel],n=ids.length;
      withUndo("Deleted "+n+" "+(n===1?"entry":"entries"),()=>{deleteEntries(ids);V.sel=null;});break;}
    case "theme":S.settings.theme=v;save();applyTheme();render();break;
    case "cat-edit":catForm(v);break;
    case "cat-new":if(v==="out"&&outCats().length>=24){snack("Up to 24 spending categories");return;}catForm(null,v);break;
    case "cat-back":{const c=S.cats.find(x=>x.id===v);if(c&&c.kind==="out"&&outCats().length>=24){snack("Up to 24 spending categories");return;}if(c){c.hidden=false;commit();snack(c.name+" is back");}break;}
    case "f-emo":$("#f-emo").value=v;$("#f-cprev").textContent=v;setPressed("f-emo",v);break;
    case "f-col":F.col=v;$("#f-cprev").setAttribute("style",ciStyle(v));setPressed("f-col",v);break;
    case "cat-save":{
      const name=$("#f-cname").value.trim(),e=$("#f-emo").value.trim()||"🏷️";if(!name){snack("Give it a name");return;}
      if(F.id)Object.assign(S.cats.find(c=>c.id===F.id),{name,e,c:F.col});
      else{const c={id:"c"+newId(),name,e,c:F.col,kind:F.ck};
        const lastVis=S.cats.map(x=>x.kind===F.ck&&!x.hidden).lastIndexOf(true);S.cats.splice(lastVis+1,0,c);}
      closeSheet();commit();break;}
    case "cat-del":{
      const c=S.cats.find(x=>x.id===F.id);if(!c)return;
      if(c.hidden){c.hidden=false;closeSheet();commit();snack(c.name+" is back");break;}
      if(S.cats.filter(x=>x.kind===c.kind&&!x.hidden).length<=1){snack("Keep at least one category");return;}
      // built-in categories and ones with entries are hidden (old entries keep their icon); unused custom ones are deleted
      if(CATS.some(d=>d.id===c.id)||S.txns.some(t=>t.cat===c.id))c.hidden=true;
      else S.cats=S.cats.filter(x=>x!==c);
      closeSheet();commit();snack(c.name+" removed");break;}
    case "export":{
      const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
      const lines=[["date","type","amount","currency","account","to_account","to_amount","category","note"].join(",")];
      [...S.txns].sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0)).forEach(t=>{const a=acc(t.account),to=acc(t.to);
        lines.push([t.date,t.type,t.amount,a?a.currency:"",q(a?a.name:""),q(to?to.name:""),t.type==="transfer"?(t.toAmount!=null?t.toAmount:t.amount):"",q(t.type==="expense"||t.type==="income"?cat(t.cat).name:""),q(t.note)].join(","));});
      saveOut("tally-entries-"+today()+".csv","text/csv",lines.join("\n"));break;}
    case "backup":saveOut("tally-backup-"+today()+".json","application/json",JSON.stringify(S));break;
    case "wipe":if(confirm("Delete every account and entry? This can't be undone.")){
      const keep={cur:S.settings.cur,theme:S.settings.theme};S=blank();Object.assign(S.settings,keep);commit();snack("All data deleted");}break;
  }
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(F&&F.kind==="tr"&&["f-amt","f-toamt","f-fee"].includes(id))trPreview();
  else if(id==="f-actual")fixPreview();
  else if(id==="cur-q")curList(ev.target.value);
  else if(id==="f-emo"){$("#f-cprev").textContent=ev.target.value.trim()||"🏷️";setPressed("f-emo",ev.target.value.trim());}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="restore-file"){const f=el.files[0];el.value="";if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t);}catch(e){snack("That isn't a Tally backup file");return;}
    if(!o||!Array.isArray(o.accounts)||!Array.isArray(o.txns)){snack("That isn't a Tally backup file");return;}
    if(!confirm("Replace everything on this phone with this backup ("+o.accounts.length+" accounts, "+o.txns.length+" entries)?"))return;
    S=migrate(o);commit();applyTheme();snack("Backup restored");});}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!window.tallyBack())return;}
  else if(e.key==="Enter"&&e.target.id==="cur-q"){const b=$('#curlist [data-act="cur-pick"]');if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&F&&e.target.tagName==="INPUT"){
    const map={tx:"tx-save",tr:"tr-save",acc:"fix-save",accf:"acc-save",catf:"cat-save"};
    const b=map[F.kind]&&document.querySelector('[data-act="'+map[F.kind]+'"]');if(b){e.preventDefault();b.click();}
  }
});

/* ---------- touch: swipe the ring, long-press to select history rows, hold-and-drag category tiles ---------- */
let sw=null,LP=null;
function pressStart(x,y,target){
  swallowClick=false;
  sw=target.closest("#ring")?{x,y}:null;
  const rc=PD&&PD.tab==="range"&&target.closest("#pd .dd");
  if(rc){LP=rc.disabled?null:{kind:"range",from:rc.dataset.v,cur:rc.dataset.v,moved:false};return;}
  const tile=target.closest(".cgrid .tile, .ring.edit .tile"),row=V.screen==="history"&&!V.sel&&target.closest('.tx[data-act="tx-open"]');
  if(!tile&&!row){LP=null;return;}
  LP={x,y,cx:x,cy:y,el:tile||row,kind:tile?"drag":"sel",active:false};
  LP.timer=setTimeout(()=>{
    if(!LP)return;LP.active=true;swallowNextClick();
    try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
    if(LP.kind==="sel"){V.sel=new Set([LP.el.dataset.v]);render();LP=null;}
    else dragBegin();
  },tile?350:450);
}
function pressMove(x,y,ev){
  if(!LP)return;
  if(LP.kind==="range"){
    if(ev.cancelable)ev.preventDefault();
    const hit=document.elementFromPoint(x,y),c=hit&&hit.closest("#pd .dd");
    if(c&&!c.disabled&&c.dataset.v!==LP.cur){LP.cur=c.dataset.v;LP.moved=true;pdPaint(LP.from<LP.cur?LP.from:LP.cur,LP.from<LP.cur?LP.cur:LP.from);}
    return;
  }
  LP.cx=x;LP.cy=y;
  if(!LP.active){if(Math.hypot(x-LP.x,y-LP.y)>10){clearTimeout(LP.timer);LP=null;}return;}
  if(ev.cancelable)ev.preventDefault();
  dragMove(x,y);
}
function pressEnd(x,y){
  if(sw&&x!=null){const dx=x-sw.x,dy=y-sw.y;
    if(!(LP&&LP.active)&&Math.abs(dx)>60&&Math.abs(dy)<50&&V.screen==="home"){if(dx>0){shiftPeriod(-1);render();}else if(canNext()){shiftPeriod(1);render();}}}
  sw=null;
  if(LP&&LP.kind==="range"){const L=LP;LP=null;
    if(L.moved){swallowNextClick();if(L.cur!==L.from)applyRange(L.from,L.cur);else pdRender();}
    return;}
  if(LP){clearTimeout(LP.timer);if(LP.active&&LP.kind==="drag")dragEnd();LP=null;}
}
function dragBegin(){
  const el=LP.el,r=el.getBoundingClientRect(),g=el.cloneNode(true);
  g.classList.add("ghost");g.removeAttribute("data-act");
  Object.assign(g.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.appendChild(g);el.classList.add("placeholder");
  Object.assign(LP,{ghost:g,dx:LP.cx-r.left,dy:LP.cy-r.top,grid:el.closest(".cgrid"),ring:el.closest(".ring.edit")});
}
function dragMove(x,y){
  const L=LP;L.ghost.style.left=(x-L.dx)+"px";L.ghost.style.top=(y-L.dy)+"px";
  if(y<70)scrollBy(0,-10);else if(y>innerHeight-70)scrollBy(0,10);
  if(L.ring){ /* move to the nearest slot of the home-screen layout; other tiles slide over */
    const rr=L.ring.getBoundingClientRect(),px=x-rr.left,py=y-rr.top,id=L.el.dataset.v;
    let k=-1,bd=Infinity;RE.L.slots.forEach((s,i)=>{if(i>=RE.order.length)return;const dd=Math.hypot(s.x-px,s.y-py);if(dd<bd){bd=dd;k=i;}});
    const cur=RE.order.indexOf(id);
    if(k<0||bd>RE.L.u*.75||k===cur)return;
    RE.order.splice(cur,1);RE.order.splice(k,0,id);
    L.ring.querySelectorAll(".tile").forEach(b=>{const s=RE.L.slots[RE.order.indexOf(b.dataset.v)];b.style.left=(s.x-RE.L.u/2)+"px";b.style.top=(s.y-RE.L.u/2)+"px";});
    return;
  }
  const hit=document.elementFromPoint(x,y),t=hit&&hit.closest(".tile");
  if(!t||t===L.el||t.parentNode!==L.grid)return;
  const tiles=[...L.grid.querySelectorAll(".tile")];
  if(tiles.indexOf(L.el)<tiles.indexOf(t))t.after(L.el);else t.before(L.el);
}
function dragEnd(){
  const L=LP;L.ghost.remove();L.el.classList.remove("placeholder");
  const kind=L.ring?"out":L.grid.dataset.kind,order=L.ring?RE.order.slice():[...L.grid.querySelectorAll(".tile")].map(b=>b.dataset.v);
  const pick=k=>k===kind?order.map(id=>S.cats.find(c=>c.id===id)).filter(Boolean).concat(S.cats.filter(c=>c.kind===k&&c.hidden))
    :S.cats.filter(c=>c.kind===k);
  S.cats=pick("out").concat(pick("in"));
  commit();
}
let lastTouch=0;const fromTouch=()=>Date.now()-lastTouch<800;
document.addEventListener("touchstart",e=>{lastTouch=Date.now();if(e.touches.length===1)pressStart(e.touches[0].clientX,e.touches[0].clientY,e.target);else{sw=null;if(LP){clearTimeout(LP.timer);LP=null;}}},{passive:true});
document.addEventListener("touchmove",e=>{const t=e.touches[0];if(t)pressMove(t.clientX,t.clientY,e);},{passive:false});
document.addEventListener("touchend",e=>{lastTouch=Date.now();const t=e.changedTouches[0];pressEnd(t?t.clientX:null,t?t.clientY:null);},{passive:true});
document.addEventListener("touchcancel",()=>pressEnd(null,null),{passive:true});
document.addEventListener("mousedown",e=>{if(e.button===0&&!fromTouch())pressStart(e.clientX,e.clientY,e.target);});
document.addEventListener("mousemove",e=>{if(LP&&!fromTouch())pressMove(e.clientX,e.clientY,e);});
document.addEventListener("mouseup",()=>{if(!fromTouch())pressEnd(null,null);});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".tile,.tx,.dd"))e.preventDefault();});
/* the ring is laid out in px from the screen width: redo it when the width changes (not when the keyboard opens) */
let lastW=innerWidth;
addEventListener("resize",()=>{if(innerWidth!==lastW){lastW=innerWidth;if((V.screen==="home"||V.screen==="settings")&&!LP)render();}});

function saveOut(name,mime,text){if(window.Android&&Android.saveFile)Android.saveFile(name,mime,text);else snack("Saving isn't available here");}
window.tallyBack=function(){
  if($("#pop").innerHTML){closePop();return true;}
  if($("#sheet2").innerHTML){closeSheet2();return true;}
  if($("#sheet").innerHTML){closeSheet();return true;}
  if(V.sel){V.sel=null;render();return true;}
  if(V.screen!=="home"){V.screen="home";render();return true;}
  return false;
};
window.tallySaved=function(ok){snack(ok?"Saved":"Not saved");};
/* coming back to the app on a new day: jump to today */
let lastDay=today();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&today()!==lastDay){lastDay=today();V.anchor=today();if(!$("#sheet").innerHTML)render();}});

readSys();applyTheme();render();
})();
</script>
