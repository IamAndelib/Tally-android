<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Material 3 roles. Fallback = baseline scheme from Tally's indigo seed; replaced by the phone's
   dynamic (wallpaper) palette on Android 12+ via #dyn below. */
:root{
  --primary:#3A4DB8;--on-primary:#FFFFFF;--primary-container:#DEE0FF;--on-primary-container:#00105C;
  --secondary-container:#E0E1F9;--on-secondary-container:#181A2C;
  --tertiary:#76546E;--tertiary-container:#FFD7F1;--on-tertiary-container:#2D1228;
  --surface:#FBF8FF;--surface-low:#F5F2FA;--surface-container:#EFEDF4;--surface-high:#E9E7EF;--surface-highest:#E4E1E9;
  --on-surface:#1B1B21;--on-surface-variant:#45464F;--outline:#767680;--outline-variant:#C6C5D0;
  --spent:#BA1A1A;--spent-container:#FFDAD6;--on-spent-container:#410002;
  --got:#146C2E;--got-container:#A3F5A8;--on-got-container:#002106;
  --minus-bg:#FADCDD;--minus-fg:#9A4550;--plus-bg:#D3F0DC;--plus-fg:#2F6B45;
  --loan-bg:#E9DDFF;--loan-fg:#4F2D8F;--lend-bg:#D4ECFB;--lend-fg:#0B5A86;--xfer:#1565C0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#BAC3FF;--on-primary:#08218A;--primary-container:#293CA0;--on-primary-container:#DEE0FF;
  --secondary-container:#424659;--on-secondary-container:#E0E1F9;
  --tertiary:#E5BAD8;--tertiary-container:#5C3D56;--on-tertiary-container:#FFD7F1;
  --surface:#131318;--surface-low:#1B1B21;--surface-container:#1F1F25;--surface-high:#2A292F;--surface-highest:#35343A;
  --on-surface:#E4E1E9;--on-surface-variant:#C6C5D0;--outline:#90909A;--outline-variant:#45464F;
  --spent:#FFB4AB;--spent-container:#93000A;--on-spent-container:#FFDAD6;
  --got:#88D990;--got-container:#005320;--on-got-container:#A3F5A8;
  --minus-bg:#4A3236;--minus-fg:#F6C1C6;--plus-bg:#2A4133;--plus-fg:#B5E4C1;
  --loan-bg:#382F4F;--loan-fg:#D8C8FF;--lend-bg:#1F3A4C;--lend-fg:#B6DDF6;--xfer:#9ECAFF;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --primary:#BAC3FF;--on-primary:#08218A;--primary-container:#293CA0;--on-primary-container:#DEE0FF;
  --secondary-container:#424659;--on-secondary-container:#E0E1F9;
  --tertiary:#E5BAD8;--tertiary-container:#5C3D56;--on-tertiary-container:#FFD7F1;
  --surface:#131318;--surface-low:#1B1B21;--surface-container:#1F1F25;--surface-high:#2A292F;--surface-highest:#35343A;
  --on-surface:#E4E1E9;--on-surface-variant:#C6C5D0;--outline:#90909A;--outline-variant:#45464F;
  --spent:#FFB4AB;--spent-container:#93000A;--on-spent-container:#FFDAD6;
  --got:#88D990;--got-container:#005320;--on-got-container:#A3F5A8;
  --minus-bg:#4A3236;--minus-fg:#F6C1C6;--plus-bg:#2A4133;--plus-fg:#B5E4C1;
  --loan-bg:#382F4F;--loan-fg:#D8C8FF;--lend-bg:#1F3A4C;--lend-fg:#B6DDF6;--xfer:#9ECAFF;
  color-scheme:dark;}
</style>
<style id="dyn"></style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--surface);color:var(--on-surface);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;position:relative;overflow:hidden}
button:disabled{opacity:.38;cursor:default}
[hidden]{display:none!important}
/* state layer */
button::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:inherit}
/* pressed: the state layer shows at once (no delay), then fades out on release. Set from touch events (.pressed),
   because :active is unreliable for touch in a WebView */
@media (hover:hover){button:not(:disabled):hover::before{opacity:.08}}
button.pressed:not(:disabled)::before{opacity:.1;transition:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:24px;height:24px;fill:currentColor;display:block;flex:none}
main{max-width:520px;margin:0 auto;padding:0 16px 24px}
.muted{color:var(--on-surface-variant)}
a{color:var(--primary);text-decoration:none}
.small{font-size:.85rem}
.spent{color:var(--spent)}.got{color:var(--got)}.xfer{color:var(--xfer)}

/* top app bar */
.appbar{display:flex;align-items:center;gap:4px;height:64px;margin:0 -8px}
.appbar h1{font-size:1.35rem;font-weight:600;margin:0 0 0 4px;flex:1;letter-spacing:-.01em}
.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-variant);flex:none}
.pnav{display:flex;align-items:center;flex:1;min-width:0}
.plabel{height:40px;padding:0 12px 0 16px;border-radius:20px;font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:2px;letter-spacing:-.01em;white-space:nowrap}
.plabel .ic{width:20px;height:20px;color:var(--on-surface-variant);flex:none}
.plabel{min-width:0}.plabel>span{overflow:hidden;text-overflow:ellipsis}
.month .plabel{font-size:1.05rem;margin:0 auto;padding:0 8px 0 12px}
.appbar>.icon{width:44px;height:44px}.pnav .icon{width:40px;height:40px}.pnav .plabel{font-size:clamp(1.05rem,4.6vw,1.25rem);padding:0 6px 0 10px}.pnav .plabel.long{font-size:clamp(.9rem,4vw,1.15rem);letter-spacing:-.02em}

/* account balance strip */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.acc{flex:none;min-width:112px;max-width:180px;background:var(--surface-container);border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.acc .n{font-size:.78rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .b{font-weight:600;font-size:1rem;white-space:nowrap}
.acc.add{min-width:56px;align-items:center;justify-content:center;color:var(--on-surface-variant);background:transparent;border:1px dashed var(--outline-variant)}

/* morning check */
.check{background:var(--primary-container);color:var(--on-primary-container);border-radius:24px;padding:16px;margin:4px 0 8px}
.check h2{margin:0;font-size:1.1rem;font-weight:600}
.check p{margin:2px 0 10px;font-size:.9rem;opacity:.85}
.ckrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border-radius:12px;text-align:left}
.ckrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckrow b{font-weight:600;white-space:nowrap}
.ckrow .fx{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid currentColor;opacity:.8}
.check .btn{margin-top:10px;background:var(--primary);color:var(--on-primary)}

/* category ring */
.ring{position:relative;margin:4px -4px 0;touch-action:pan-y}
.ring.edit{margin:0 -4px;background:var(--surface-container);border-radius:20px}
.leaders{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:16px;min-width:0}
.cat .ci{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem}
.cat .cn{font-size:.72rem;color:var(--on-surface-variant);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cp{font-size:.72rem;font-weight:700;min-height:1em}
.dwrap{position:absolute;z-index:1;display:block;padding:0;border-radius:50%}
.dwrap::before{display:none}
.donut{width:100%;height:100%;display:block}
.rt{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 0 0;border-radius:16px;transition:left .2s,top .2s}
.rt .ci{width:var(--d);height:var(--d);font-size:calc(var(--d)*.5)}
.rt .cn,.rt .cp{font-size:var(--f);line-height:1.25}
.dcenter{position:absolute;inset:0;padding:0 18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dcenter .g{font-size:.9rem;font-weight:600;color:var(--got)}
.dcenter .s{font-size:1.2rem;font-weight:700;color:var(--spent);letter-spacing:-.01em;white-space:nowrap}
.dcenter .s.zero{color:var(--on-surface-variant);font-weight:600}
.dcenter .hint{font-size:clamp(.66rem,calc(var(--D,160px)*.07),.8rem);color:var(--on-surface-variant);margin-top:2px;line-height:1.25}
.curbtn{pointer-events:auto;margin-top:4px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-high);color:var(--on-surface-variant)}

/* balance bar + fabs */
.balbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:20px;padding:14px 16px;text-align:left}
.balbar .l{flex:1;font-size:.9rem}
.balbar b{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.balbar .ic{opacity:.7}
.fabs{display:flex;align-items:center;justify-content:space-around;margin-top:18px}
.fab{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06)}
.fab .ic{width:36px;height:36px}
.fab.minus{background:var(--minus-bg);color:var(--minus-fg)}
.fab.plus{background:var(--plus-bg);color:var(--plus-fg)}
.fab.xfer{width:76px;height:64px;border-radius:20px;background:var(--surface-high);color:var(--on-surface-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600}
.fab.xfer .ic{width:26px;height:26px}

/* generic */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:24px;padding:0 20px;font-weight:600;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{background:transparent;color:var(--primary)}
.btn.danger{background:transparent;color:var(--spent);border:1px solid var(--outline-variant)}
.btn .ic{width:20px;height:20px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.gap{height:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
#f-person-sug{margin-top:8px}
.chip{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--outline-variant);display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500;color:var(--on-surface-variant);white-space:nowrap}
.strip .chip{flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip[aria-pressed="true"]::after{content:"✓";font-size:.8rem}
.smc{display:flex;align-items:stretch;height:170px;border-bottom:1px solid var(--outline-variant);margin:4px 0 0}
.smcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px;border-radius:12px}
.smcol .v{font-size:.72rem;color:var(--on-surface-variant);height:1.1em;white-space:nowrap}
.smcol .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.smcol .b{width:min(60%,26px);border-radius:4px 4px 0 0;background:var(--spent);opacity:.45}
.smcol .x{font-size:.72rem;color:var(--on-surface-variant);white-space:nowrap}
.smcol.on .b{opacity:1}.smcol.on .v,.smcol.on .x{color:var(--on-surface);font-weight:700}
.smchart,#ring{touch-action:pan-y}
.smrows{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.smrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;height:36px;padding:0 8px;border-radius:10px;text-align:left}
.smrow .x{font-size:.8rem;color:var(--on-surface-variant);white-space:nowrap;min-width:92px}
.smrow .tr{height:10px;border-radius:5px;background:var(--surface-high);overflow:hidden}
.smrow .b{display:block;height:100%;border-radius:5px;background:var(--spent);opacity:.45}
.smrow .v{font-size:.8rem;color:var(--on-surface-variant);min-width:40px;text-align:right}
.smrow.on .b{opacity:1}.smrow.on .x,.smrow.on .v{color:var(--on-surface);font-weight:700}
.smpie{position:relative;width:190px;height:190px;margin:8px auto 0}
.smpie svg{width:100%;height:100%;display:block}
.smpie .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.smpie .c b{font-size:1.5rem;letter-spacing:-.01em}.smpie .c span{font-size:.8rem;color:var(--on-surface-variant)}
.smd{text-align:center;padding:14px 0 6px}.smd .big{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.smtop .tx{padding:10px 14px}
.pbar{display:block;height:4px;border-radius:2px;background:var(--surface-highest);margin-top:6px;overflow:hidden}.pbar span{display:block;height:100%;border-radius:2px}
.dlg-t{font-size:1.2rem;font-weight:600;margin:6px 4px 8px}
.dlg-x{margin:0 4px 8px;color:var(--on-surface-variant);line-height:1.45}
.btn.text.dng{color:var(--spent)}
.dlg-act.stack{flex-direction:column;align-items:flex-end;gap:0}.dlg-act.stack .btn{width:auto}
.chip.addnew{border-style:dashed;border-color:var(--outline);color:var(--on-surface-variant);opacity:.8}
.chip.addnew .ic{width:18px;height:18px}
.dot.addnew{display:grid;place-items:center;border:2px dashed var(--outline);color:var(--on-surface-variant);background:transparent}
.dot.addnew .ic{width:18px;height:18px}
.lbl{font-size:.8rem;font-weight:600;color:var(--on-surface-variant);margin:16px 0 8px}
.field{display:block;margin:12px 0 0}
.field>span{display:block;font-size:.8rem;font-weight:600;color:var(--on-surface-variant);margin-bottom:6px}
input,select{width:100%;height:52px;padding:0 14px;border:1px solid var(--outline);border-radius:12px;background:transparent;outline:none}
input:focus,select:focus{border:2px solid var(--primary);padding:0 13px}
input:focus-visible,select:focus-visible{outline:0}
select option{background:var(--surface-high);color:var(--on-surface)}
.amtwrap{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--primary);padding:4px 2px;margin-top:8px}
.amtwrap .cur{font-weight:600;color:var(--on-surface-variant);font-size:1.1rem}
.amtwrap input{border:0;height:64px;padding:0;font-size:2.4rem;font-weight:700;letter-spacing:-.02em;caret-color:var(--primary)}
.amtwrap input:focus{border:0;padding:0}
.amtwrap input:focus-visible{outline:0}
.amtwrap:focus-within{border-bottom-width:3px;margin-bottom:-1px}
.amtwrap .calcbtn{width:36px;height:36px;flex:none;color:var(--on-surface-variant)}
.amtbox{position:relative;flex:1;min-width:0}
.amtbox.calcing input{color:transparent}
.caretmirror{position:absolute;inset:0;line-height:64px;font-size:2.4rem;font-weight:700;letter-spacing:-.02em;color:var(--on-surface);white-space:pre;overflow:hidden;cursor:text}
.caretmirror .blink{display:inline-block;width:2px;height:2.6rem;margin-left:2px;vertical-align:middle;background:var(--primary);animation:blink 1s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caretmirror .blink{animation:none}}
.calc{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface-low);
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.22);
  animation:up .18s cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion:reduce){.calc{animation:none}}
.calc button{height:56px;border-radius:12px;background:var(--surface-high);font-weight:600;font-size:1.15rem}
.calc button.op{background:var(--secondary-container);color:var(--on-secondary-container)}
.calc button.del{color:var(--spent);font-size:1.2rem}
.preview{font-size:.85rem;color:var(--on-surface-variant);background:var(--surface-high);border-radius:12px;padding:10px 12px;margin-top:12px}
.preview:empty{display:none}
.hint{font-size:.8rem;color:var(--on-surface-variant);margin:6px 2px 0}
.err{color:var(--spent)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.catgrid .cat[aria-pressed="true"] .ci{box-shadow:0 0 0 3px var(--surface-low),0 0 0 5px var(--primary)}
.catchip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 6px;border-radius:24px;background:var(--surface-high);font-weight:600}
.catchip .ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
.catchip .ic{width:18px;height:18px;color:var(--on-surface-variant);transition:transform .15s}
.catchip[aria-expanded="true"] .ic{transform:rotate(180deg)}

/* lists */
.list{background:var(--surface-container);border-radius:20px;overflow:hidden}
.day{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--on-surface-variant);padding:16px 14px 8px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-radius:0}
.tx+.tx{border-top:1px solid var(--outline-variant)}
.tx .em{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;flex:none;background:var(--surface-high)}
.tx .mid{flex:1;min-width:0}
.tx .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:.8rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap;text-align:right}
.tx.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.tx .em.pick{background:transparent;color:var(--primary)}
.tx .code{font-weight:700;width:44px;flex:none}
.tx>.ic{color:var(--primary)}
.tx .a small{display:block;font-weight:400;font-size:.75rem;color:var(--on-surface-variant)}
.tx .a .rb{display:block;font-weight:500;font-size:.72rem;color:var(--on-surface-variant);max-width:170px;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
.tx .s .st{margin-right:2px;vertical-align:1px}
.tx.exp{flex-wrap:wrap;row-gap:0}
.tx .more{display:none;flex-basis:100%;font-size:.85rem;color:var(--on-surface-variant);padding:6px 0 2px 52px;line-height:1.4}
.tx.open .more{display:block}
.tx .more .medit{display:flex;flex-wrap:wrap;gap:0 4px;margin:4px 0 0 -8px}
.tx .more .medit .btn{width:auto;height:36px;padding:0 8px;font-size:.85rem}.tx .more .medit .btn .ic{width:18px;height:18px}
.tx .chev{display:grid;place-items:center;color:var(--on-surface-variant);margin-left:-4px}.tx .chev .ic{width:20px;height:20px;transition:transform .15s}.tx.open .chev .ic{transform:rotate(180deg)}
.tx.exp{cursor:pointer}
.empty{text-align:center;padding:28px 12px;color:var(--on-surface-variant)}
.sec{font-size:.85rem;font-weight:600;color:var(--primary);margin:24px 4px 8px}
.welcome{text-align:center;padding:48px 16px}
.welcome .big{font-size:3rem}
.welcome h2{font-size:1.4rem;margin:12px 0 6px}
.welcome p{color:var(--on-surface-variant);margin:0 0 24px}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface-container);border-radius:24px;padding:4px}
.month b{font-weight:600}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{flex:1;height:40px;font-weight:500;font-size:.9rem;border-radius:0}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.hero{text-align:center;padding:4px 0 8px}
.hero .t{font-size:.85rem;color:var(--on-surface-variant)}
.hero .v{font-size:2.2rem;font-weight:700;letter-spacing:-.02em}
.card{background:var(--surface-container);border-radius:20px;padding:16px;margin-top:12px}
.card h3{margin:0 0 4px;font-size:1rem;font-weight:600}

/* sheet, menu, snackbar */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .p{overscroll-behavior:contain;background:var(--surface-low);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,0,0,1)}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline-variant);margin:6px auto 10px}
.sheet .h{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:4px}
.sheet .h h2{margin:0;font-size:1.3rem;font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .p{animation:none}}
.pop{position:fixed;inset:0;z-index:15}
.menu{position:absolute;min-width:180px;background:var(--surface-container);border-radius:8px;padding:8px 0;box-shadow:0 2px 6px 2px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.3)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;text-align:left;border-radius:0}
.menu button[aria-checked="true"]{font-weight:600;color:var(--primary)}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--on-surface);color:var(--surface);min-height:48px;padding:6px 8px 6px 16px;border-radius:8px;font-size:.9rem;z-index:20;width:calc(100% - 32px);max-width:480px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.snack span{flex:1}
.snack button{color:var(--primary-container);font-weight:600;padding:8px 12px;border-radius:20px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
/* emblems */
.emb{display:inline-grid;place-items:center;border-radius:50%;flex:none;width:40px;height:40px;overflow:hidden}
.emb svg{width:58%;height:58%;display:block}
.emb .emo{line-height:1}
.emb.sm{width:22px;height:22px;font-size:.7rem;vertical-align:middle;margin-right:6px}
.acc .n .emb.sm{width:20px;height:20px}
.btn .emb.sm{margin-right:0}
.cprevbtn{border-radius:50%}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center;padding:4px 0}
.icbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.icbtn .emb{width:48px;height:48px}
.icbtn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface-low),0 0 0 5px var(--primary)}
.dots .dot{width:34px;height:34px}
/* date picker header, time grid */
.dp-h{padding:4px 8px 8px;border-bottom:1px solid var(--outline-variant);margin-bottom:4px}
.dp-h .t{font-size:.8rem;color:var(--on-surface-variant)}
.dp-h .big{font-size:1.6rem;font-weight:600}
.tgrid{grid-template-columns:repeat(4,1fr)}
.tgrid button{height:44px;font-size:.85rem}
/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface-container);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav:empty{display:none}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:76px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;font-weight:500;color:var(--on-surface-variant);border-radius:0}
.nav button::before{display:none}
.nav .ind{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"]{color:var(--on-surface);font-weight:700}
.nav button[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
body.hasnav main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.hasnav .snack{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
/* loans */
.loanbtns{display:flex;gap:12px;margin-top:18px}
.loanbtns .fbtn{flex:1;height:64px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05rem;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06)}
.fbtn.loan{background:var(--loan-bg);color:var(--loan-fg)}.fbtn.lend{background:var(--lend-bg);color:var(--lend-fg)}
.fbtn .emb{width:32px;height:32px}
.todayrow{display:flex;justify-content:flex-end;margin:10px 0 -4px}
.todaychip{height:32px;padding:0 12px 0 8px;border-radius:16px;display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:600;background:var(--primary-container);color:var(--on-primary-container)}
.todaychip .ic{width:18px;height:18px}
#ic-emo-box .field{text-align:center}#ic-emo-box #ic-emo{display:block;margin:0 auto}
.st{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-highest);color:var(--on-surface-variant)}
.st.active{background:var(--secondary-container);color:var(--on-secondary-container)}
.st.partly{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.st.overdue{background:var(--spent-container);color:var(--on-spent-container)}
.st.cleared{background:var(--got-container);color:var(--on-got-container)}
.bar{height:8px;border-radius:4px;background:var(--surface-highest);overflow:hidden;margin:4px 0 4px}
.bar span{display:block;height:100%;background:var(--primary);border-radius:4px}
.sumcard{background:var(--primary-container);color:var(--on-primary-container);border-radius:24px;padding:16px 18px;margin-top:4px}
.sumcard.owe{background:var(--secondary-container);color:var(--on-secondary-container)}
.sumcard .t{font-size:.85rem;opacity:.85}
.sumcard .big{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
/* settings rows + switch */
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.setrow+.setrow{border-top:1px solid var(--outline-variant)}
.setrow .mid{flex:1;min-width:0}
.setrow .s{font-size:.8rem;color:var(--on-surface-variant)}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-highest);flex:none}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .15s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{left:22px;width:24px;height:24px;background:var(--on-primary)}
.sheet.s2{z-index:12}
.s2 .p{height:88%}
.qbar{position:sticky;top:-8px;background:var(--surface-low);padding:4px 0 8px;z-index:2}
.fieldbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:52px;padding:0 10px 0 14px;border:1px solid var(--outline);border-radius:12px;text-align:left}
.fieldbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fieldbtn .ic{color:var(--on-surface-variant)}
/* settings category grids */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-container);border-radius:20px;padding:8px 4px}
.tile,.tx{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.placeholder{opacity:.25}
.tx.placeholder{opacity:.3}
.ghost.gh-row{transform:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
/* drag between sections (Assets / Liabilities) */
.dropbox{display:none;align-items:center;justify-content:center;gap:8px;height:64px;margin-top:8px;border:2px dashed var(--outline);border-radius:20px;color:var(--on-surface-variant);font-size:.9rem;font-weight:600;opacity:.8}
.dropbox .ic{width:20px;height:20px}
.dropbox.dropok{display:flex}
.dropbox.dropover{border-style:solid;border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container);opacity:1}
/* motion: kept deliberately small and cheap: state layer on press, a soft flash on the row that changed, snackbar in */
.flash{animation:flash .7s ease-out}
/* the one deliberate flourish: a tapped tab's icon flips once like a coin */
.nav .ic.flip{animation:tabflip .42s cubic-bezier(.2,0,0,1)}
@keyframes tabflip{from{transform:perspective(160px) rotateY(0)}to{transform:perspective(160px) rotateY(360deg)}}
@keyframes flash{from{background:var(--secondary-container)}to{background:transparent}}
.snack{animation:snackin .2s cubic-bezier(.2,0,0,1)}
@keyframes snackin{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.ghost{position:fixed;z-index:30;pointer-events:none;transition:none;transform:scale(1.1);background:var(--surface-high);border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);margin:0}
.tile-add .ci{border:2px dashed var(--outline);color:var(--on-surface-variant)}
.cprev{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;margin:0 auto 4px}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo-grid button{height:40px;border-radius:10px;font-size:1.3rem}
.emo-grid button[aria-pressed="true"]{background:var(--secondary-container)}
.dots{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface-low),0 0 0 4px var(--on-surface)}
/* period dialog */
.pop.scrim{background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px}
html.lock,body.lock{overflow:hidden}
.dialog{overscroll-behavior:contain;background:var(--surface-high);border-radius:28px;padding:16px;width:100%;max-width:360px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dialog{animation:none}}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.cal-h b{font-weight:600}
.cal-wd,.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd span{text-align:center;font-size:.75rem;color:var(--on-surface-variant);padding:6px 0}
.wk{margin:2px 0}
/* the cell spans its column (so a range band joins up); the circle is a fixed 40x40 ::after */
.dd{height:40px;display:flex;align-items:center;justify-content:center;font-size:.9rem;border-radius:0;isolation:isolate;-webkit-user-select:none;user-select:none}
.dd::before{inset:0;margin:auto;width:40px;height:40px;border-radius:50%}
.dd::after{content:"";position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;z-index:-1}
.dd.other{color:var(--on-surface-variant)}
.dd.now{color:var(--primary);font-weight:600}
.dd.now::after{box-shadow:inset 0 0 0 1px var(--primary)}
.dd.in{background:var(--secondary-container);color:var(--on-secondary-container)}
.dd.rs{background:linear-gradient(90deg,transparent 50%,var(--secondary-container) 50%)}
.dd.re{background:linear-gradient(90deg,var(--secondary-container) 50%,transparent 50%)}
.dd.rs.re{background:none}
.dd.sel,.dd.rs,.dd.re{color:var(--on-primary)}
.dd.sel::after,.dd.rs::after,.dd.re::after{background:var(--primary);box-shadow:none}
.dd .dt{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.cal{touch-action:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mgrid button{height:48px;border-radius:24px;font-weight:500}
.mgrid button.now{box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary)}
.mgrid button.sel{background:var(--primary);color:var(--on-primary)}
.dlg-act{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 4px;margin-top:12px}
.dlg-act .btn{width:auto}
</style>
</head>

/* Home (V) and History (HP) each have their own period: {period:"day"|"range"|"month", anchor, rs, re} */
const HP={period:"month",anchor:today(),rs:null,re:null};
function range(p=V){
  const a=p.anchor;
  if(p.period==="day")return [a,a];
  if(p.period==="range")return [p.rs,p.re];
  const m=a.slice(0,7),[y,mo]=m.split("-").map(Number);return [m+"-01",m+"-"+pad(new Date(y,mo,0).getDate())];
}
function periodLabel(p=V){
  const t=today(),[s,e]=range(p);
  if(p.period==="day")return p.anchor===t?"Today":p.anchor===addDays(t,-1)?"Yesterday":dayLabel(p.anchor);
  if(p.period==="range"){
    if(s===e)return s===t?"Today":dayLabel(s);
    const a=parseISO(s),b=parseISO(e),mo=x=>x.toLocaleDateString(undefined,{month:"short"});
    return a.getDate()+(a.getMonth()!==b.getMonth()||a.getFullYear()!==b.getFullYear()?" "+mo(a):"")+"\u2009–\u2009"+b.getDate()+" "+mo(b);
  }
  const m=p.anchor.slice(0,7);
  if(p===HP||m.slice(0,4)===t.slice(0,4))return monthLabel(m,p===HP);
  return parseISO(m+"-01").toLocaleDateString(undefined,{month:"short",year:"numeric"});
}
function shiftPeriod(n,p=V){
  if(p.period==="day")p.anchor=addDays(p.anchor,n);
  else if(p.period==="range"){
    const len=Math.round((parseISO(p.re)-parseISO(p.rs))/864e5)+1;
    p.rs=addDays(p.rs,n*len);p.re=addDays(p.re,n*len);
    if(p.re>today()){p.re=today();p.rs=addDays(p.re,1-len);}
    return;
  }
  else p.anchor=shiftMonth(p.anchor.slice(0,7),n)+"-01";
  if(p.anchor>today())p.anchor=today();
}

function iconSearch(q){
  const words=q.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean),names=Object.keys(ICONS);

  let d=addDays(first,-off);

      if(o.hs&&d>=o.hs&&d<=o.he){if(d===o.hs)cls.push("rs");if(d===o.he)cls.push("re");if(d>o.hs&&d<o.he)cls.push("in");}

/* ---------- category ring around the donut (shared by Home and the Settings preview) ---------- */
/* Where n tiles go around the donut: evenly spaced on a circle that hugs the donut.
   More categories → smaller tiles, so the circle stays round and there is never an empty slot.
   Slots come back clockwise, starting just left of 12 o'clock. */
/* distance from a tile centre to the donut edge, in tile sizes (smaller = bigger donut); checked against every n and width */
const DONUT_GAP=.64;
function ringLayout(n,W){
  const TWO=2*Math.PI,N=720;
  const oval=(a,b)=>{const pts=[],cum=[0];for(let k=0;k<=N;k++){const t=-Math.PI/2+k/N*TWO;pts.push([a*Math.cos(t),b*Math.sin(t)]);
    if(k)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));}return {pts,cum,P:cum[N]};};
  let u=92,a,b,O;
  for(;u>=34;u-=1){
    a=W/2-u/2;let ok=false;
    b=a;O=oval(a,b);ok=O.P/n>=u*.96;
    if(ok)break;
  }
  if(!O)O=oval(a,b);
  const step=O.P/n,slots=[];
  for(let i=0;i<n;i++){
    let target=((n===1?0:(i-.5)*step)%O.P+O.P)%O.P,k=0;
    while(k<N&&O.cum[k+1]<target)k++;
    const f=(target-O.cum[k])/((O.cum[k+1]-O.cum[k])||1),x=O.pts[k][0]+(O.pts[k+1][0]-O.pts[k][0])*f,y=O.pts[k][1]+(O.pts[k+1][1]-O.pts[k][1])*f;
    slots.push({x:W/2+x,y:b+u/2+y});
  }
  const H=2*b+u,D=2*(Math.min(a,b)-DONUT_GAP*u);
  return {W,H,u,slots,cx:W/2,cy:H/2,D:Math.max(D,90)};
}
const TAU=2*Math.PI;
const circDist=(a,b)=>{const x=((a-b)%1+1)%1;return Math.min(x,1-x);};
/* point of a slice [start,start+w) (fractions of the circle) nearest to angle a, kept a little inside the slice */
function nearestInSlice(a,start,w){
  const e=Math.min(.01,w/2),rel=((a-start)%1+1)%1;
  if(rel>=e&&rel<=w-e)return a;
  return circDist(a,start+e)<circDist(a,start+w-e)?start+e:start+w-e;
}
let RE=null; /* the Settings preview's layout + order while it is on screen */
function ringHTML(cats,o){
  const home=o.mode==="home",W=Math.max(240,$("#app").clientWidth-24),L=ringLayout(Math.max(cats.length,1),W);
  const {u,D,cx,cy,H}=L,d=Math.round(u*(u<70?.5:.56)),f=Math.max(8,Math.min(11.5,u*.125));
  const pos=cats.map((c,i)=>{const s=L.slots[i];return {c,x:s.x,top:s.y-u/2,ix:s.x,iy:s.y-u/2+4+d/2,
    ang:((Math.atan2(s.y-cy,s.x-cx)/TAU+.25)%1+1)%1};});
  const tile=p=>{const v=home?(o.by[p.c.id]||0):0;
    return '<button class="cat rt'+(home?"":" tile")+'" style="left:'+(p.x-u/2).toFixed(1)+"px;top:"+p.top.toFixed(1)+"px;width:"+u.toFixed(1)+"px;height:"+u.toFixed(1)+"px;--d:"+d+"px;--f:"+f.toFixed(1)+'px" data-act="'+(home?"add-cat":"cat-edit")+'" data-v="'+esc(p.c.id)+'"'+(home?' aria-label="Add '+esc(p.c.name)+'"':"")+">"+
      emblem(p.c,"ci")+'<span class="cn">'+esc(p.c.name)+"</span>"+
      (home?'<span class="cp" style="color:'+p.c.c+'">'+(v?Math.max(1,Math.round(v/o.spent*100))+"%":"")+"</span>":"")+"</button>";};
  const R=40,C=2*Math.PI*R,Rout=D/2*.92; /* stroke outer edge: (40+6)/50 of the radius */
  let segs="",lines="",rot=-90;
  if(home&&o.spent>0){
    /* slices follow the tiles clockwise (not size), so leader lines never cross */
    const posOf=id=>pos.find(p=>p.c.id===id);
    const ent=Object.entries(o.by).filter(([,v])=>v>0).map(([id,v])=>({id,v,w:v/o.spent,p:posOf(id)}))
      .sort((a,b)=>(a.p?a.p.ang:2)-(b.p?b.p.ang:2));
    let off=0;ent.forEach(s=>{s.start=off;off+=s.w;});
    /* turn the whole donut so each slice sits as close as possible to its category, and never let two lines cross */
    const segCross=(p,q)=>{const o=(a,b,c)=>Math.sign((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
      return o(p[0],p[1],q[0])*o(p[0],p[1],q[1])<0&&o(q[0],q[1],p[0])*o(q[0],q[1],p[1])<0;};
    const linked=ent.filter(s=>s.p);
    let phi=0,bestCost=Infinity;
    for(let k=0;k<360;k++){const ph=k/360;let cost=0;
      const segs=linked.map(s=>{const a=nearestInSlice(s.p.ang,s.start+ph,s.w),dd=circDist(a,s.p.ang),th=a*TAU-TAU/4;cost+=dd*dd;
        return [[cx+Rout*Math.cos(th),cy+Rout*Math.sin(th)],[s.p.ix,s.p.iy]];});
      for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++)if(segCross(segs[i],segs[j]))cost+=10;
      if(cost<bestCost-1e-12){bestCost=cost;phi=ph;}}
    rot=phi*360-90;
    const gap=ent.length>1?1.4:0;
    ent.forEach(s=>{const len=s.w*C,l=Math.max(len-gap,.6);
      segs+='<circle r="'+R+'" cx="50" cy="50" fill="none" stroke="'+cat(s.id).c+'" stroke-width="12" stroke-dasharray="'+l.toFixed(2)+" "+(C-l).toFixed(2)+'" stroke-dashoffset="'+(-s.start*C).toFixed(2)+'"/>';
      if(!s.p)return;
      const a=nearestInSlice(s.p.ang,s.start+phi,Math.max(s.w-gap/C,.001)),th=a*TAU-TAU/4;
      const x1=cx+Rout*Math.cos(th),y1=cy+Rout*Math.sin(th),p=s.p;
      let x2,y2;
      const yb=p.top+u-2;
      const kb=y1>yb+2?(yb-y1)/(p.iy-y1):-1,xb=x1+(p.ix-x1)*kb;
      if(kb>0&&kb<1&&Math.abs(xb-p.x)<u/2-6){x2=xb;y2=yb;} /* coming up from below: stop under the labels */
      else{const dx=p.ix-x1,dy=p.iy-y1,Ln=Math.hypot(dx,dy)||1,rr=d/2+3;x2=p.ix-dx/Ln*rr;y2=p.iy-dy/Ln*rr;}
      if(Math.hypot(x2-x1,y2-y1)<4)return;
      const col=cat(s.id).c;
      lines+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="1.25" stroke-opacity=".85" stroke-linecap="round"/>'+
        '<circle cx="'+x1.toFixed(1)+'" cy="'+y1.toFixed(1)+'" r="2.2" fill="'+col+'"/>';
    });
  }
  const donut='<svg viewBox="0 0 100 100" class="donut" aria-hidden="true"><circle r="34" cx="50" cy="50" style="fill:var(--surface)"/><g transform="rotate('+rot.toFixed(2)+' 50 50)"><circle r="'+R+'" cx="50" cy="50" fill="none" style="stroke:var(--surface-highest)" stroke-width="12"/>'+segs+"</g></svg>";
  const box='left:'+(cx-D/2).toFixed(1)+"px;top:"+(cy-D/2).toFixed(1)+"px;width:"+D.toFixed(1)+"px;height:"+D.toFixed(1)+"px;--D:"+D.toFixed(1)+"px";
  /* amount font: as large as fits inside the hole (about 62% of the donut) */
  const fit=txt=>Math.max(11,Math.min(22,D*.11,.62*D/(Math.max(3,String(txt).length)*.6))).toFixed(1)+"px";
  let center;
  if(home){const cs=currencies();
    center='<button class="dwrap" data-act="summary" aria-label="Spending summary" style="'+box+'">'+donut+'<div class="dcenter">'+
      (o.got?'<div class="g">+'+esc(money(o.got,o.cur,true))+"</div>":"")+
      '<div class="s'+(o.spent?"":" zero")+'" style="font-size:'+fit(money(o.spent,o.cur,true))+'">'+esc(money(o.spent,o.cur,true))+"</div>"+
      (!o.spent&&!o.got?'<div class="hint">Tap a category</div>':"")+
      (cs.length>1?'<span class="curbtn" data-act="cur-next" role="button">'+esc(o.cur)+" ⇄</span>":"")+"</div></button>";}
  else{RE={L,order:cats.map(c=>c.id)};
    center='<div class="dwrap" style="'+box+'">'+donut+'<div class="dcenter"><div class="hint">Spending</div></div></div>';}
  return '<div class="ring'+(home?"":" edit")+'"'+(home?' id="ring"':"")+' style="height:'+H.toFixed(1)+'px">'+
    '<svg class="leaders" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+'" viewBox="0 0 '+W.toFixed(1)+" "+H.toFixed(1)+'" aria-hidden="true">'+lines+"</svg>"+
    center+pos.map(tile).join("")+"</div>";
}
/* ---------- loans (you borrowed) and lendings (you lent) ---------- */
const loan=id=>S.loans.find(l=>l.id===id);
/* paid so far, what is left and the status; everything is derived from the loan's entries */
/* a loan/lending is one or more "draws" (principal entries), each with its own amount, date and optional due date;
   payments reduce the shared pool (not attributed to a specific draw — see CLAUDE.md) */
function loanInfo(l){
  const draws=S.txns.filter(t=>t.type==="loan"&&t.loan===l.id&&t.principal).sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0));
  const pays=S.txns.filter(t=>t.type==="loan"&&t.loan===l.id&&!t.principal);
  const total=r2(draws.reduce((s,t)=>s+t.amount,0)),paid=r2(pays.reduce((s,t)=>s+t.amount,0)),left=r2(Math.max(0,total-paid));
  const newest=draws[draws.length-1],a=acc(newest?newest.account:l.account),cur=a?a.currency:S.settings.cur;
  const nextDue=draws.map(t=>t.due).filter(Boolean).sort()[0]||"";
  const st=left<=0?"cleared":l.status==="writeoff"?"writeoff":nextDue&&nextDue<today()?"overdue":paid>0?"partly":"active";
  return {draws,pays,total,paid,left,cur,nextDue,st,open:st!=="cleared"&&st!=="writeoff"};
}
function stLabel(l,st){return {active:"Active",partly:"Partly paid",overdue:"Overdue",cleared:"Cleared",writeoff:l.kind==="lend"?"Written off":"Forgiven"}[st];}
const loanWho=l=>l.person||(l.kind==="lend"?"Someone":"Someone");
function loanRow(l,drag){
  const i=loanInfo(l),lend=l.kind==="lend";
  const a=acc(l.account),src=(lend?"From ":"Into ")+(a?a.name:"?")+" · ";
  const sub=src+(i.open?(i.nextDue?(lend?"Payback ":"Return by ")+dayLabel(i.nextDue):"No due date"):(lend?"Lent ":"Borrowed ")+dayLabel(l.date));
  return '<button class="tx'+(FX.row===l.id?" flash":"")+'" data-act="loan-open" data-v="'+l.id+'"'+(drag?' data-drag="loan:'+l.id+'"':"")+">"+emblem(LOAN_EMB[l.kind],"em")+'<span class="mid"><div class="d">'+esc(loanWho(l))+'</div><div class="s">'+esc(sub)+"</div></span>"+
    '<span class="a">'+esc(money(i.open?i.left:i.total,i.cur))+'<small><span class="st '+i.st+'">'+esc(stLabel(l,i.st))+"</span></small></span></button>";
}
/* people you already have an open loan/lending of the same kind + currency with (most recently drawn on first) */
function personCandidates(kind,cur,q){
  const qq=q.trim().toLowerCase(),seen=new Set(),out=[];
  S.loans.forEach(l=>{
    if(l.kind!==kind||!l.person)return;
    const i=loanInfo(l);if(!i.open||i.cur!==cur)return;
    if(qq&&!l.person.toLowerCase().startsWith(qq))return;
    const key=l.person.toLowerCase();if(seen.has(key))return;seen.add(key);
    out.push({l,ts:i.draws.length?i.draws[i.draws.length-1].ts||0:0});
  });
  return out.sort((a,b)=>b.ts-a.ts).slice(0,6).map(x=>x.l);
}
function personSuggest(q){
  if(!F||F.kind!=="loanf")return;const el=$("#f-person-sug");if(!el)return;
  const cur=(acc(F.account)||{}).currency,list=cur?personCandidates(F.lk,cur,q||""):[];
  el.hidden=!list.length;
  el.innerHTML=list.map(l=>'<button class="chip" data-act="f-person-pick" data-v="'+esc(l.id)+'">'+esc(l.person)+"</button>").join("");
}

function saveLoanDraw(){

function saveLoan(){
  const v=readVals(),person=$("#f-person").value.trim(),amt=evalAmt(v.amount),due=$("#f-due").dataset.v,lend=F.lk==="lend";
  if(!person){snack(lend?"Who did you lend to?":"Who lent you the money?");return;}
  if(!(amt>0)){snack("Enter an amount");return;}
  if(!acc(F.account)){snack("Pick an account");return;}
  if(!v.date){snack("Pick a date");return;}
  if(due&&due<v.date){snack("That date is before the loan itself");return;}
  const account=F.account,acct=acc(account),date=v.date,note=(v.note||"").trim();
  let merge=null;
  if(F.merge){const ml=loan(F.merge);if(ml&&ml.kind===F.lk&&loanInfo(ml).open&&loanInfo(ml).cur===acct.currency)merge=ml;}
  const pid=newId(),ts=Date.now(),l=merge||{id:newId(),kind:F.lk,person,account,date,note,status:"open"};
  const mutate=()=>{
    if(!merge)S.loans.push(Object.assign({},l));
    else{const l2=loan(l.id);if(l2)l2.account=account;}
    S.txns.push({id:pid,ts,type:"loan",dir:lend?"out":"in",loan:l.id,principal:true,amount:amt,account,date,due,note});
  };
  guardOverdraw(mutate,date,()=>{
    S.settings.lastAcc=account;closeSheet();
    withUndo((lend?"Lent ":"Borrowed ")+money(amt,acct.currency)+(lend?" to ":" from ")+person,mutate,{row:l.id});
    askNotify();
  });
}
function payLoan(){
  const l=loan(F.id);if(!l)return;const i=loanInfo(l),v=readVals(),amt=evalAmt(v.amount),lend=l.kind==="lend";
  if(!(amt>0)){snack("Enter an amount");return;}
  if(!acc(F.account)){snack("Pick an account");return;}
  if(amt>i.left+.005){overpay(l,i,amt,F.account,v.date||today());return;}
  const id=l.id,account=F.account,date=v.date||today(),done=r2(i.left-amt)<=0,pid=newId(),ts=Date.now();
  const mutate=()=>{S.txns.push({id:pid,ts,type:"loan",dir:lend?"in":"out",loan:id,amount:amt,account,date,note:""});};
  guardOverdraw(mutate,date,()=>{closeSheet();withUndo((lend?"Got back ":"Paid back ")+money(amt,i.cur)+(done?" · all cleared":""),mutate,{row:id});});
}
/* someone paid back more than they owed (or you did): clear this one and track the extra as a loan the other way */
function overpay(l,i,amt,account,date){
  const lend=l.kind==="lend",who=loanWho(l),extra=r2(amt-i.left),cur=i.cur,pid=newId(),nid=newId(),qid=newId(),ts=Date.now();
  askDialog(lend?who+" paid "+money(extra,cur)+" more":"You paid "+money(extra,cur)+" more",
    lend?"Track the extra "+money(extra,cur)+" as a loan from "+who+" (you now owe it)?":"Track the extra "+money(extra,cur)+" as a lending to "+who+" (they owe you)?",
    lend?"Track as loan":"Track as lending",()=>{
      const mutate=()=>{
        if(i.left>0)S.txns.push({id:pid,ts,type:"loan",dir:lend?"in":"out",loan:l.id,amount:i.left,account,date,note:""});
        S.loans.push({id:nid,ts,kind:lend?"borrow":"lend",person:l.person,account,date,note:"",status:"open"});
        S.txns.push({id:qid,ts:ts+1,type:"loan",dir:lend?"in":"out",loan:nid,principal:true,amount:extra,account,date,note:""});
      };
      guardOverdraw(mutate,date,()=>{closeSheet();
        withUndo(lend?who+"’s lending cleared · you owe "+who+" "+money(extra,cur):"Loan cleared · "+who+" owes you "+money(extra,cur),mutate,{row:nid});});
    },{cancel:"Go back"});
}
/* dropped on Cleared: ask how it was cleared, because one way moves money */
function clearLoan(id){
  const l=loan(id);if(!l)return;const i=loanInfo(l),lend=l.kind==="lend",who=loanWho(l);if(!i.open)return;
  const la=acc(l.account),account=la&&!la.archived?l.account:(activeAccounts().find(a=>a.currency===i.cur)||{}).id,pid=newId(),ts=Date.now();
  const paid=()=>{if(!account){snack("No account in "+i.cur+" to record it");return;}
    const mutate=()=>{S.txns.push({id:pid,ts,type:"loan",dir:lend?"in":"out",loan:id,amount:i.left,account,date:today(),note:""});};
    guardOverdraw(mutate,today(),()=>{V.showCleared=true;withUndo((lend?"Got back ":"Paid back ")+money(i.left,i.cur)+" · all cleared",mutate,{row:id});});};
  const off=()=>{V.showCleared=true;withUndo(lend?"Written off":"Marked as forgiven",()=>{loan(id).status="writeoff";},{row:id});};
  askDialog(lend?"Clear "+who+"’s lending?":"Clear the loan from "+who+"?",(lend?who+" still owes ":"You still owe "+who+" ")+money(i.left,i.cur)+".",
    lend?"Got it all back":"Paid it all back",paid,{alt:[lend?"Write it off":"Mark as forgiven",off]});
}
/* back to open: a written-off one just reopens; a fully paid one drops its latest payment (the user's choice) */
function reopenLoan(id){
  const l=loan(id);if(!l)return;const i=loanInfo(l),lend=l.kind==="lend",who=loanWho(l);
  if(i.st==="writeoff"){withUndo((lend?who+" owes you ":"You owe "+who+" ")+money(i.left,i.cur)+" again",()=>{loan(id).status="open";},{row:id});buzz(12);return;}
  if(i.st!=="cleared")return;
  const last=i.pays.slice().sort(byNewest)[0];if(!last)return;
  withUndo((lend?who+" owes you ":"You owe "+who+" ")+money(last.amount,i.cur)+" again",()=>{S.txns=S.txns.filter(t=>t.id!==last.id);loan(id).status="open";},{row:id});
  buzz(12);
}
function setArchived(id,on){
  const a=acc(id);if(!a||a.archived===on)return;
  withUndo(on?a.name+" archived":a.name+" is back",()=>{acc(id).archived=on;},{row:id});

/* the snooze: move the due date on from whichever is later, the old due date or today */
function extendLoan(l,days){
  const i=loanInfo(l);
  const t=i.draws.find(d=>d.due===i.nextDue)||i.draws[i.draws.length-1];
  if(!t)return;
  t.due=addDays(t.due&&t.due>today()?t.due:today(),days);
}

/* ---------- reminders: the native side shows the notifications ---------- */
function syncReminders(){
  if(!(window.Android&&Android.setReminders))return;
  const r=S.settings.remind||{},tm=/^\d\d:\d\d$/.test(r.time)?r.time:"21:00";
  const last=S.txns.reduce((m,t)=>{const c=t.ts?iso(new Date(t.ts)):t.date,d=c>t.date?c:t.date;return d>m?d:m;},"");
  const dues=r.dues===false?[]:S.loans.map(l=>({l,i:loanInfo(l)})).filter(x=>x.i.open&&x.i.nextDue)
    .map(({l,i})=>({id:l.id,date:i.nextDue,kind:l.kind,who:loanWho(l),amount:money(i.left,i.cur)}));
  try{Android.setReminders(JSON.stringify({daily:{on:r.daily!==false,h:+tm.slice(0,2),m:+tm.slice(3)},lastEntry:last,dues}));}catch(e){}
}
function askNotify(){
  if(S.settings.notifAsked||!(window.Android&&Android.requestNotifications))return;
  S.settings.notifAsked=true;save();try{Android.requestNotifications();}catch(e){}
}
/* +1 day / +1 week tapped on a notification while the app was closed */
function applyNativeActions(){
  if(!(window.Android&&Android.takeActions))return;
  let list=[];try{list=JSON.parse(Android.takeActions()||"[]");}catch(e){}
  let changed=false;
  list.forEach(x=>{const l=x&&loan(x.id);if(x.type==="extend"&&l&&loanInfo(l).open){extendLoan(l,+x.days||1);changed=true;}});
  if(changed){save();render();}
}
window.tallyOpen=function(s){
  const [k,id,pay]=String(s||"").split(":");
  if(k==="add"){ /* from the widget's quick add: today, on Home */
    applyNativeActions();closePop();BACKTO=null;closeSheet();V.screen="home";V.period="day";V.anchor=today();render();
    if(!activeAccounts().length)return;
    if(id==="out")txSheet(null,"expense");else if(id==="in")txSheet(null,"income");else if(id==="tr")trSheet();

  if(k!=="loan"||!loan(id))return;

};

function curSym(c){
  if(c in curSyms)return curSyms[c];let s="";
  try{const p=new Intl.NumberFormat(undefined,{style:"currency",currency:c,currencyDisplay:"narrowSymbol"}).formatToParts(0).find(x=>x.type==="currency");if(p&&p.value!==c)s=p.value;}catch(e){}

/* ---------- spending summary (tap the donut): days / weeks / months as bars ---------- */
let SM=null;
const compact=n=>{n=Math.round(n);const a=Math.abs(n);if(a<1000)return String(n);if(a<1e4)return (n/1e3).toFixed(1).replace(/\.0$/,"")+"k";if(a<1e6)return Math.round(n/1e3)+"k";return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";};
const weekStart=d=>addDays(d,-((parseISO(d).getDay()+6)%7));
function summarySheet(){
  const [,e]=range(),t=today();
  SM={mode:V.period==="month"?"m":"d",end:e>t?t:e,sel:null,cur:viewCur()};
  openSheet("Spending"+(currencies().length>1?" · "+SM.cur:""),'<div class="seg">'+[["d","Days"],["w","Weeks"],["m","Months"]].map(([k,l])=>'<button data-act="sm-mode" data-v="'+k+'" aria-pressed="'+(SM.mode===k)+'">'+l+"</button>").join("")+
    '</div><div id="sm"></div>');
  smRender();
}
/* the buckets on screen, oldest first, plus one before them (for "vs last ...") */
function smBuckets(){
  const t=today(),e=SM.end,out=[];
  if(SM.mode==="d")for(let i=7;i>=0;i--){const d=addDays(e,-i);out.push({s:d,e:d,x:parseISO(d).toLocaleDateString(undefined,{weekday:"short"}),full:d===t?"Today":d===addDays(t,-1)?"Yesterday":dayLabel(d)});}
  else if(SM.mode==="w"){const w=weekStart(e);for(let i=8;i>=0;i--){const s=addDays(w,-7*i);out.push({s,e:addDays(s,6),x:parseISO(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}),full:"Week of "+parseISO(s).toLocaleDateString(undefined,{day:"numeric",month:"short"})});}}
  else{const m0=e.slice(0,7);for(let i=6;i>=0;i--){const m=shiftMonth(m0,-i),[y,mo]=m.split("-").map(Number);
    out.push({s:m+"-01",e:m+"-"+pad(new Date(y,mo,0).getDate()),x:parseISO(m+"-01").toLocaleDateString(undefined,{month:"short"}),full:monthLabel(m)});}}
  const inCur=x=>{const a=acc(x.account);return a&&a.currency===SM.cur;};
  const sp=S.txns.filter(x=>x.type==="expense"&&inCur(x));
  out.forEach(b=>{b.list=sp.filter(x=>x.date>=b.s&&x.date<=b.e);b.v=r2(b.list.reduce((q,x)=>q+x.amount,0));
    const last=b.e<t?b.e:t;b.days=last<b.s?0:Math.round((parseISO(last)-parseISO(b.s))/864e5)+1;});
  return out;
}
/* "3–9 Aug", "31 Aug–6 Sep" */
function wkLabel(a,b){const s=parseISO(a),e=parseISO(b),mo=x=>x.toLocaleDateString(undefined,{month:"short"});
  return s.getDate()+(s.getMonth()!==e.getMonth()?" "+mo(s):"")+"–"+e.getDate()+" "+mo(e);}
/* categories of a set of expenses, biggest first */
function catSplit(list){const m={};list.forEach(x=>{m[x.cat]=(m[x.cat]||0)+x.amount;});return Object.entries(m).map(([k,v])=>[k,r2(v)]).sort((p,q)=>q[1]-p[1]);}
/* donut of a month by category: category colours, 2px gaps, total in the middle */
function smDonut(split,total){
  const R=40,C=2*Math.PI*R,gap=split.length>1?1.2:0;let off=0,segs="";
  split.forEach(([k,v])=>{const len=Math.max(.5,v/total*C-gap);
    segs+='<circle r="'+R+'" cx="50" cy="50" fill="none" stroke="'+cat(k).c+'" stroke-width="15" stroke-dasharray="'+len.toFixed(2)+" "+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"><title>'+esc(cat(k).name)+"</title></circle>";off+=v/total*C;});
  if(!split.length)segs='<circle r="'+R+'" cx="50" cy="50" fill="none" stroke="var(--surface-highest)" stroke-width="15"/>';
  return '<div class="smpie"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-90 50 50)">'+segs+"</g></svg>"+
    '<div class="c"><b>'+esc(total?compact(total):"0")+'</b><span>spent</span></div></div>';
}
function smRender(){
  const el=$("#sm");if(!el||!SM)return;
  const all=smBuckets(),bars=all.slice(1),n=bars.length,t=today(),M=SM.mode==="m";
  if(M||SM.sel==null||SM.sel>=n)SM.sel=n-1;
  const max=Math.max(...bars.map(b=>b.v),0),i=SM.sel,b=bars[i],prev=all[i],cur=SM.cur;
  const canNext=bars[n-1].e<t;
  let h='<div class="cal-h"><button class="icon" data-act="sm-nav" data-v="-1" aria-label="Earlier">'+ic("left")+"</button><b>"+esc(M?monthLabel(b.s.slice(0,7),true):smSpan(bars))+
    '</b><button class="icon" data-act="sm-nav" data-v="1" aria-label="Later"'+(canNext?"":" disabled")+">"+ic("right")+"</button></div>";
  const split=catSplit(b.list);
  if(SM.mode==="d")h+='<div class="smchart smc" role="list">'+bars.map((x,k)=>{const pct=max?x.v/max*100:0,future=x.s>t;
    return '<button class="smcol'+(k===i?" on":"")+'" role="listitem" data-act="sm-pick" data-v="'+k+'"'+(future?" disabled":"")+' aria-label="'+esc(x.full+": "+money(x.v,cur))+'">'+
      '<span class="v">'+(x.v?esc(compact(x.v)):"")+'</span><span class="bw"><span class="b" style="height:'+(x.v?Math.max(2,pct):0).toFixed(1)+'%"></span></span><span class="x">'+esc(x.x)+"</span></button>";}).join("")+"</div>";
  else if(SM.mode==="w")h+='<div class="smchart smrows" role="list">'+bars.map((x,k)=>{const pct=max?x.v/max*100:0;
    return '<button class="smrow'+(k===i?" on":"")+'" role="listitem" data-act="sm-pick" data-v="'+k+'" aria-label="'+esc(x.full+": "+money(x.v,cur))+'">'+
      '<span class="x">'+esc(wkLabel(x.s,x.e))+'</span><span class="tr"><span class="b" style="width:'+(x.v?Math.max(2,pct):0).toFixed(1)+'%"></span></span><span class="v">'+(x.v?esc(compact(x.v)):"–")+"</span></button>";}).join("")+"</div>";
  else h+='<div class="smchart">'+smDonut(split,b.v)+"</div>";
  /* details for the chosen bar */
  const unit={d:"the day before",w:"last week",m:"last month"}[SM.mode];
  /* a week or month that isn't over yet is compared by its daily average, not its (still growing) total */
  const len=x=>Math.round((parseISO(x.e)-parseISO(x.s))/864e5)+1,part=SM.mode!=="d"&&b.days<len(b);
  let cmp="";if(prev&&prev.v>0&&b.days>0){const p=Math.round(part?((b.v/b.days)/(prev.v/len(prev))-1)*100:(b.v-prev.v)/prev.v*100);
    cmp=p===0?"Same as "+unit:(p>0?"↑ ":"↓ ")+Math.abs(p)+"% vs "+unit;}
  const avg=SM.mode!=="d"&&b.days>0&&b.v?"Avg "+money(r2(b.v/b.days),cur)+" a day":"";
  const top=M?split:split.slice(0,3);
  h+='<div class="smd">'+(M?"":'<div class="muted small">'+esc(b.full)+"</div>")+'<div class="big spent">'+esc(money(b.v,cur))+"</div>"+
    ((cmp||avg)?'<div class="muted small">'+esc([avg,cmp].filter(Boolean).join(" · "))+"</div>":"")+"</div>";
  if(top.length)h+='<div class="list smtop">'+top.map(([k,v])=>{const c=cat(k),p=v/b.v*100;return '<div class="tx">'+emblem(c,"em")+'<span class="mid"><div class="d">'+esc(c.name)+
    (M?' <span class="muted small">'+(p<1?"<1":Math.round(p))+"%</span>":"")+'</div><span class="pbar"><span style="width:'+p.toFixed(1)+"%;background:"+c.c+'"></span></span></span><span class="a">'+esc(money(v,cur))+"</span></div>";}).join("")+"</div>";
  else h+='<div class="empty" style="padding:16px">Nothing spent '+({d:"that day",w:"that week",m:"in "+monthLabel(b.s.slice(0,7))}[SM.mode])+".</div>";
  h+='<div class="gap"></div><button class="btn tonal" data-act="sm-open">Open '+({d:"this day",w:"this week",m:"this month"}[SM.mode])+" on Home</button>";
  el.innerHTML=h;
}
/* "18 – 24 Sep", "3 Aug – 27 Sep", "Apr – Sep" (year added when it isn't this year) */
function smSpan(bars){
  const s=parseISO(bars[0].s),e=parseISO(bars[bars.length-1].e),y=new Date().getFullYear(),yr=e.getFullYear()!==y?" "+e.getFullYear():"";
  if(SM.mode==="m")return s.toLocaleDateString(undefined,{month:"short"})+" – "+e.toLocaleDateString(undefined,{month:"short"})+yr;
  const mo=x=>x.toLocaleDateString(undefined,{month:"short"});
  return s.getDate()+(s.getMonth()!==e.getMonth()?" "+mo(s):"")+" – "+e.getDate()+" "+mo(e)+yr;
}
function smNav(d){
  const t=today();let e=SM.end;
  if(SM.mode==="d")e=addDays(e,7*d);else if(SM.mode==="w")e=addDays(e,56*d);
  else{const m=shiftMonth(e.slice(0,7),d),[y,mo]=m.split("-").map(Number);e=m+"-"+pad(new Date(y,mo,0).getDate());}
  SM.end=e>t?t:e;SM.sel=null;smRender();
}
function smOpen(){
  const b=smBuckets().slice(1)[SM.sel],t=today();if(!b)return;
  if(SM.mode==="d"){V.period="day";V.anchor=b.s;}
  else if(SM.mode==="w"){V.period="range";V.rs=b.s;V.re=b.e>t?t:b.e;}
  else{V.period="month";V.anchor=b.s;}
  closeSheet();render();
}

/* ---------- saving ---------- */
/* Money sources (not credit cards) shouldn't go below zero. Try the change on a copy first; if it would take an account
   below zero (now, or at the end of that day) and lower than it already was, ask before saving. */
function guardOverdraw(mutate,date,proceed){
  const b0=balances(),d0=balances(addDays(date,1)),T=S.txns,L=S.loans;let b1,d1;
  S.txns=JSON.parse(JSON.stringify(T));S.loans=JSON.parse(JSON.stringify(L));
  try{mutate();b1=balances();d1=balances(addDays(date,1));}finally{S.txns=T;S.loans=L;}
  const low=(n,o)=>n<-.004&&n<o-.004;
  const bad=S.accounts.find(a=>a.type!=="card"&&(low(b1[a.id],b0[a.id])||low(d1[a.id],d0[a.id])));
  if(!bad){proceed();return;}
  const now=low(b1[bad.id],b0[bad.id]),had=now?b0[bad.id]:d0[bad.id],will=now?b1[bad.id]:d1[bad.id];
  askDialog("Not enough in "+bad.name,now?bad.name+" has "+money(had,bad.currency)+". This would make it "+signed(will,bad.currency)+"."
    :bad.name+" had "+money(had,bad.currency)+" at the end of "+shortDay(date)+". This would make it "+signed(will,bad.currency)+" that day.",
    "Save anyway",proceed,{cancel:"Go back"});
}
function saveTx(){
  const v=readVals(),amt=evalAmt(v.amount);
  if(!F.cat){snack("Pick a category");return;}
  if(!(amt>0)){snack("Enter an amount");return;}
  if(!acc(F.account)){snack("Pick an account");return;}
  if(!v.date){snack("Pick a date");return;}
  const t={type:F.type,amount:amt,account:F.account,cat:F.cat,date:v.date,note:(v.note||"").trim()};
  if(F.type==="income")S.settings.lastAccIn=F.account;else S.settings.lastAcc=F.account;
  const id=F.id,nid=newId(),ts=Date.now();
  const mutate=id?()=>{const old=S.txns.find(x=>x.id===id);Object.assign(old,t);}:()=>{S.txns.push(Object.assign({id:nid,ts},t));};
  guardOverdraw(mutate,t.date,()=>{
    closeSheet();buzz(10);
    withUndo(id?"Saved":(t.type==="income"?"+":"−")+money(amt,acc(t.account).currency)+" · "+cat(t.cat).name,mutate,{row:id||nid,cat:t.cat,center:true});
  });
}
function saveTr(){
  const v=readVals(),fa=acc(F.from),ta=acc(F.to);
  if(!fa||!ta){snack("Pick both accounts");return;}
  if(F.from===F.to){snack("Pick two different accounts");return;}
  const amt=evalAmt(v.amount);if(!(amt>0)){snack("Enter the amount sent");return;}
  const diff=fa.currency!==ta.currency;let got=null;
  if(diff){got=evalAmt(v.toAmount);if(!(got>0)){snack("Enter how much arrived in "+ta.currency);return;}}
  const fee=F.showFee?(evalAmt(v.fee)||0):0;if(fee<0){snack("Fee can't be negative");return;}
  if(!v.date){snack("Pick a date");return;}
  const id=F.id,from=F.from,to=F.to,date=v.date,note=(v.note||"").trim(),nid=newId(),fid=newId(),ts=Date.now();
  const mutate=()=>{
    let t=id?S.txns.find(x=>x.id===id):null;
    if(!t){t={id:nid,ts};S.txns.push(t);}
    const oldFee=t.feeId?S.txns.find(x=>x.id===t.feeId):null;
    Object.assign(t,{type:"transfer",amount:amt,account:from,to,date,note});
    if(diff)t.toAmount=got;else delete t.toAmount;
    if(fee>0){
      const f=oldFee||{id:fid,ts};if(!oldFee)S.txns.push(f);
      Object.assign(f,{type:"expense",amount:r2(fee),account:from,cat:"fees",date,note:"Transfer fee",feeOf:t.id});
      t.feeId=f.id;
    }else{if(oldFee)S.txns=S.txns.filter(x=>x!==oldFee);delete t.feeId;}
  };
  guardOverdraw(mutate,date,()=>{closeSheet();withUndo(id?"Saved":"Transferred "+money(amt,fa.currency)+" to "+ta.name,mutate,{row:id||nid});});
}
/* delete entries by id, keeping transfers + fees and loans + their payments consistent */
function deleteEntries(ids){
  ids=new Set(ids);
  const gone=new Set(S.txns.filter(t=>ids.has(t.id)&&t.type==="loan"&&t.principal).map(t=>t.loan));
  if(gone.size){S.txns.forEach(t=>{if(t.type==="loan"&&gone.has(t.loan))ids.add(t.id);});S.loans=S.loans.filter(l=>!gone.has(l.id));}
  S.txns.forEach(t=>{if(ids.has(t.id)&&t.feeId)ids.add(t.feeId);});
  S.txns=S.txns.filter(t=>!ids.has(t.id));
  S.txns.forEach(t=>{if(t.feeId&&ids.has(t.feeId))delete t.feeId;});
}

/* a long-press or drag may end with a click from the same gesture; swallow it (reset by the next press, or after 1s) */
let swallowClick=false,swallowT=0;
function swallowNextClick(){swallowClick=true;clearTimeout(swallowT);swallowT=setTimeout(()=>{swallowClick=false;},1000);}
document.addEventListener("click",ev=>{
  if(swallowClick){swallowClick=false;ev.preventDefault();ev.stopPropagation();return;}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==="sheet-bg"){if(ev.target===el)closeSheet();return;}
  if(act==="sheet2-bg"){if(ev.target===el)closeSheet2();return;}
  if(act==="pop-bg"){if(ev.target===el)closePop();return;}
  if(el.tagName==="SELECT"||el.tagName==="INPUT")return;
  if(el.closest(".menu"))closePop();
  switch(act){
    case "home":V.screen="home";render();scrollTo(0,0);break;
    case "go":closeSheet();V.screen=v==="accounts"?"assets":v;render();scrollTo(0,0);break;
    case "tab":V.screen=v;FLIP=v;render();scrollTo(0,0);break;
    case "toggle-cleared":V.showCleared=!V.showCleared;render();break;
    case "loan-new":loanForm(v);break;
    case "loan-save":saveLoan();break;
    case "loan-open":loanOpen(v);break;
    case "loan-pay":payLoan();break;
    case "loandraw-edit":loanDrawEdit(v);break;
    case "loandraw-save":saveLoanDraw();break;
    case "ed-acc":F.editAcc=v;setPressed("ed-acc",v);break;
    case "loanpay-del":{const id=v;closeSheet();withUndo("Payment deleted",()=>{S.txns=S.txns.filter(x=>x.id!==id);});break;}
    case "loan-writeoff":{const l=loan(F.id);if(!l)return;const lend=l.kind==="lend",back=l.status==="writeoff";closeSheet();
      withUndo(back?"Reopened":lend?"Written off":"Marked as forgiven",()=>{const x=loan(l.id);x.status=back?"open":"writeoff";});break;}
    case "loan-del":{const id=F.id;closeSheet();withUndo("Deleted",()=>{S.loans=S.loans.filter(l=>l.id!==id);S.txns=S.txns.filter(t=>!(t.type==="loan"&&t.loan===id));});break;}
    case "asset-edit":assetForm(v);break;

/* ---------- touch: swipe the ring, long-press to select history rows, hold-and-drag category tiles ---------- */
let sw=null,LP=null,smSw=null;
function pressStart(x,y,target){
  swallowClick=false;
  const layer=!!($("#sheet").innerHTML||$("#pop").innerHTML);
  sw=!layer&&target.closest("#ring")?{x,y}:null;
  smSw=target.closest("#sm .smchart")?{x,y}:null;
  const rc=PD&&PD.tab==="range"&&target.closest("#pd .dd");
  if(rc){LP=rc.disabled?null:{kind:"range",x,y,from:rc.dataset.v,cur:rc.dataset.v,moved:false};return;}
  const tile=target.closest(".cgrid .tile, .ring.edit .tile"),row=V.screen==="history"&&!V.sel&&target.closest('.tx[data-act="tx-open"]');
  const mv=(V.screen==="assets"||V.screen==="liabs")&&target.closest(".tx[data-drag]");
  const hold=target.closest('#sheet .chip[data-ctype]')||target.closest('#f-dots .dot[data-act="f-col"]');
  if(hold){LP={x,y,cx:x,cy:y,el:hold,kind:"hold",active:false};
    LP.timer=setTimeout(()=>{if(!LP)return;LP.active=true;swallowNextClick();buzz(12);const el=LP.el;LP=null;pressOff(true);
      if(el.classList.contains("dot"))removeColour(el.dataset.v);else removeType(el.dataset.v);},500);return;}
  if(!tile&&!row&&!mv){LP=null;return;}
  LP={x,y,cx:x,cy:y,el:tile||row||mv,kind:tile?"drag":row?"sel":"move",active:false};
  LP.timer=setTimeout(()=>{
    if(!LP)return;LP.active=true;swallowNextClick();
    try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
    if(LP.kind==="sel"){V.sel=new Set([LP.el.dataset.v]);render();LP=null;}
    else dragBegin();
  },tile||mv?350:450);
}
function pressMove(x,y,ev){
  if(!LP)return;
  if(LP.kind==="range"){
    if(ev.cancelable)ev.preventDefault();
    const hit=document.elementFromPoint(x,y),c=hit&&hit.closest("#pd .dd");
    if(!LP.moved&&Math.hypot(x-LP.x,y-LP.y)<12)return; /* not a drag yet: finger jitter on a tap */
    if(c&&!c.disabled&&c.dataset.v!==LP.cur){LP.cur=c.dataset.v;LP.moved=true;pdPaint(LP.from<LP.cur?LP.from:LP.cur,LP.from<LP.cur?LP.cur:LP.from);}
    return;
  }
  LP.cx=x;LP.cy=y;
  if(!LP.active){if(Math.hypot(x-LP.x,y-LP.y)>10){clearTimeout(LP.timer);LP=null;}return;}
  if(ev.cancelable)ev.preventDefault();
  dragMove(x,y);
}
function pressEnd(x,y){
  if(sw&&x!=null){const dx=x-sw.x,dy=y-sw.y;
    if(!(LP&&LP.active)&&Math.abs(dx)>60&&Math.abs(dy)<50&&V.screen==="home"&&!$("#sheet").innerHTML&&!$("#pop").innerHTML){if(dx>0){shiftPeriod(-1);render();}else if(canNext()){shiftPeriod(1);render();}}}
  sw=null;
  /* swipe the summary chart: earlier / later, like the ‹ › above it */
  if(smSw&&x!=null&&SM){const dx=x-smSw.x,dy=y-smSw.y;if(Math.abs(dx)>60&&Math.abs(dy)<50){const nb=$('#sm [data-act="sm-nav"][data-v="1"]');
    if(dx>0)smNav(-1);else if(nb&&!nb.disabled)smNav(1);swallowNextClick();}}
  smSw=null;

    if(L.moved){swallowNextClick();if(L.cur!==L.from)applyRange(L.from,L.cur);else pdRender();}
    return;}
  if(LP){clearTimeout(LP.timer);if(LP.active&&LP.kind==="drag")dragEnd();else if(LP.active&&LP.kind==="move")rowDrop();LP=null;}

function dragBegin(){
  const el=LP.el,r=el.getBoundingClientRect(),g=el.cloneNode(true);
  g.classList.add("ghost");g.removeAttribute("data-act");

/* where a row may be dropped (source list data-src -> slot data-zone): archived <-> accounts, cleared -> open (clearing stays explicit) */
const ZONE_TO={acc:"arch",arch:"acc","lend-done":"lend-open","borrow-done":"borrow-open","lend-open":"lend-done","borrow-open":"borrow-done"};
function rowDrop(){
  const L=LP,ok=!!L.over;
  document.querySelectorAll(".dropok,.dropover").forEach(z=>z.classList.remove("dropok","dropover"));
  L.el.classList.remove("placeholder");
  L.ghost.remove();
  if(!ok)return; /* dropped elsewhere: nothing changes */
  const [type,id]=L.el.dataset.drag.split(":");
  S.settings.dragTip=true;buzz(12);
  if(type==="acc")setArchived(id,L.to==="arch");
  else if(/-done$/.test(L.to))clearLoan(id);
  else reopenLoan(id);

function dragMove(x,y){

    if(ok!==!!L.over||(ok&&L.overEl!==z)){document.querySelectorAll(".dropover").forEach(e=>e.classList.remove("dropover"));if(ok)z.classList.add("dropover");}
    L.over=ok;L.overEl=ok?z:null;return;
  }

    const cur=RE.order.indexOf(id);
    if(k<0||bd>RE.L.u*.75||k===cur)return;
    RE.order.splice(cur,1);RE.order.splice(k,0,id);
    L.ring.querySelectorAll(".tile").forEach(b=>{const s=RE.L.slots[RE.order.indexOf(b.dataset.v)];b.style.left=(s.x-RE.L.u/2)+"px";b.style.top=(s.y-RE.L.u/2)+"px";});
    return;
  }
  const hit=document.elementFromPoint(x,y),t=hit&&hit.closest(".tile");
  if(!t||t===L.el||t.parentNode!==L.grid)return;
  const tiles=[...L.grid.querySelectorAll(".tile")];
  if(tiles.indexOf(L.el)<tiles.indexOf(t))t.after(L.el);else t.before(L.el);
}
function dragEnd(){
  const L=LP;L.ghost.remove();L.el.classList.remove("placeholder");
  const kind=L.ring?"out":L.grid.dataset.kind,order=L.ring?RE.order.slice():[...L.grid.querySelectorAll(".tile")].map(b=>b.dataset.v);
  const pick=k=>k===kind?order.map(id=>S.cats.find(c=>c.id===id)).filter(Boolean).concat(S.cats.filter(c=>c.kind===k&&c.hidden))
    :S.cats.filter(c=>c.kind===k);
  S.cats=pick("out").concat(pick("in"));
  commit();
}
let lastTouch=0;const fromTouch=()=>Date.now()-lastTouch<800;
/* pressed look: on at touch-down, off at release (kept ~90ms so a quick tap is still seen), off at once if the finger scrolls */
let PRESS=null,pressAt=0,pressXY=null;
function pressOn(t,x,y){pressOff(true);const b=t&&t.closest&&t.closest("button");if(!b||b.disabled)return;PRESS=b;pressAt=Date.now();pressXY=[x,y];b.classList.add("pressed");}
function pressOff(now){const b=PRESS;if(!b)return;PRESS=null;const w=now?0:Math.max(0,90-(Date.now()-pressAt));if(w)setTimeout(()=>b.classList.remove("pressed"),w);else b.classList.remove("pressed");}
const pressMoved=(x,y)=>{if(PRESS&&pressXY&&Math.hypot(x-pressXY[0],y-pressXY[1])>10)pressOff(true);};
document.addEventListener("touchstart",e=>{lastTouch=Date.now();if(e.touches.length===1)pressOn(e.target,e.touches[0].clientX,e.touches[0].clientY);else pressOff(true);if(e.touches.length===1)pressStart(e.touches[0].clientX,e.touches[0].clientY,e.target);else{sw=null;if(LP){clearTimeout(LP.timer);LP=null;}}},{passive:true});
document.addEventListener("touchmove",e=>{const t=e.touches[0];if(t)pressMoved(t.clientX,t.clientY);if(t)pressMove(t.clientX,t.clientY,e);},{passive:false});
document.addEventListener("touchend",e=>{lastTouch=Date.now();pressOff();const t=e.changedTouches[0];pressEnd(t?t.clientX:null,t?t.clientY:null);},{passive:true});
document.addEventListener("touchcancel",()=>{pressOff(true);pressEnd(null,null);},{passive:true});
document.addEventListener("mousedown",e=>{if(e.button===0&&!fromTouch())pressOn(e.target,e.clientX,e.clientY);if(e.button===0&&!fromTouch())pressStart(e.clientX,e.clientY,e.target);});
document.addEventListener("mousemove",e=>{if(LP&&!fromTouch())pressMove(e.clientX,e.clientY,e);});
document.addEventListener("mouseup",()=>{if(!fromTouch()){pressOff();pressEnd(null,null);}});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".tile,.tx,.dd,.chip,.dot"))e.preventDefault();});
/* the ring is laid out in px from the screen width: redo it when the width changes (not when the keyboard opens) */
let lastW=innerWidth;
addEventListener("resize",()=>{if(innerWidth!==lastW){lastW=innerWidth;if((V.screen==="home"||V.screen==="settings")&&!LP)render();}});

function saveOut(name,mime,text){if(window.Android&&Android.saveFile)Android.saveFile(name,mime,text);else snack("Saving isn't available here");}
window.tallyBack=function(){
  if(CALC){calcClose(CALC.id,document.querySelector('[data-act="calc-toggle"][data-v="'+CALC.id+'"]'),true);return true;}
  if($("#pop").innerHTML){closePop();return true;}
  if($("#sheet2").innerHTML){closeSheet2();return true;}
  if($("#sheet").innerHTML){closeSheet();return true;}
  if(V.sel){V.sel=null;render();return true;}
  if(V.screen!=="home"){V.screen="home";render();return true;}
  return false;
};
window.tallySaved=function(ok){snack(ok?"Saved":"Not saved");};
/* coming back to the app on a new day: jump to today */
let lastDay=today();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&today()!==lastDay){lastDay=today();V.anchor=today();if(!$("#sheet").innerHTML)render();}});

readSys();applyTheme();applyNativeActions();render();syncReminders();syncWidget();
if(activeAccounts().length)askNotify();
})();
</script>
