plugins {
    id 'com.android.application'
}

// CI numbers every build (GITHUB_RUN_NUMBER): test builds use it as their versionCode, so each one installs as an
// update over the one before. Release builds use the fixed tallyVersionCode from gradle.properties.
def runNumber = System.getenv('GITHUB_RUN_NUMBER')

// Release signing key: never in the repository. CI decodes it from the RELEASE_KEYSTORE_BASE64 secret and
// passes its path and password in these variables; without them a release build comes out unsigned.
def releaseKeystore = System.getenv('TALLY_KEYSTORE')

// Test builds' ("Tally Dev") key: not in the repository either. CI decodes it from the DEBUG_KEYSTORE_BASE64 secret into
// app/debug.keystore, so every CI build is signed the same way and updates the one installed; never replace it.
// Without the file (your own checkout, F-Droid), Android's usual debug key on your machine signs them.
def debugKeystore = file('debug.keystore')

android {
    namespace 'app.tally.expenses'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tally.expenses'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(project.property('tallyVersionCode'))
        versionName project.property('tallyVersion')
    }

    // BuildConfig.VERSION_NAME is read by the JS bridge (Bridge.getVersion()) for Settings' About footer
    buildFeatures {
        buildConfig true
    }

    // No Google-encrypted "dependency metadata" block in the APK or bundle: nothing reads it outside Play, and F-Droid
    // and IzzyOnDroid ask for it to be left out (it also gets in the way of reproducible builds).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        if (debugKeystore.exists()) {
            debug {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('TALLY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TALLY_KEY_ALIAS') ?: 'tally'
                keyPassword System.getenv('TALLY_KEY_PASSWORD') ?: System.getenv('TALLY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        // Test builds: their own app id ("Tally Dev"), so they install next to the release instead of clashing
        // with its signature, and each CI build updates the previous test build in place.
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix '.dev'
            versionNameSuffix runNumber ? "-dev.${runNumber}" : '-dev'
        }
        release {
            // Not minified: the app is a WebView over local files, and R8 gains little while risking the JS bridge.
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// test builds ("Tally Dev") count up with every CI build instead
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        if (runNumber) {
            variant.outputs.each { output -> output.versionCode.set(Integer.parseInt(runNumber)) }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
