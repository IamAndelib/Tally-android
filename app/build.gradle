plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tally.expenses'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tally.expenses'
        minSdk 24
        targetSdk 34
        // CI numbers every build so each APK installs as an update over the last one
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // BuildConfig.VERSION_NAME is read by the JS bridge (Bridge.getVersion()) for Settings' About footer
    buildFeatures {
        buildConfig true
    }

    // One committed debug key (not a secret) so every build is signed the same way;
    // otherwise each CI runner signs with a new random key and Android refuses to update.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
