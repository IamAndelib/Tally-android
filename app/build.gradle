plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tally.expenses'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tally.expenses'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
