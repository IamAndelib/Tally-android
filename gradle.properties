org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The app's version (semantic versioning). To release: bump it here and in CHANGELOG.md, merge to main,
# then push the tag v<version> (e.g. v1.0.0); CI checks that the tag matches before it publishes.
tallyVersion=1.1.0

# AGP 8.5 is tested up to API 34; Play needs targetSdk 35, which builds fine
android.suppressUnsupportedCompileSdk=35
