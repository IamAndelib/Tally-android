org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The app's version. To release, bump both here, add a CHANGELOG.md section and
# fastlane/metadata/android/en-US/changelogs/<tallyVersionCode>.txt, and merge to main: CI publishes v<tallyVersion>.
# tallyVersion is semantic (major.minor.patch); tallyVersionCode = major*10000 + minor*100 + patch, so it always rises
# and anyone rebuilding from source (F-Droid) gets the same number.
tallyVersion=1.1.1
tallyVersionCode=10101

# AGP 8.5 is tested up to API 34; Play needs targetSdk 35, which builds fine
android.suppressUnsupportedCompileSdk=35
