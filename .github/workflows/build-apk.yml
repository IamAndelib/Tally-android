# Keep this file's name: the run number (GITHUB_RUN_NUMBER) is counted per workflow file and is test builds' versionCode.
name: Build APK

on:
  push:
    branches-ignore:
      - builds
      - previews
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # for whoever can't download GitHub's release files (an automated session): the preview, encrypted to this key
      preview_key:
        description: "Public key (PEM, base64 on one line): also put the preview, encrypted to it, on the previews branch"
        required: false
        default: ""

# read-only by default; only the jobs that publish (the builds branch, a release) may write
permissions:
  contents: read

jobs:
  check:
    name: Lint and end-to-end tests
    # Playwright 1.56 has no browser for ubuntu-latest's newer Ubuntu: stay on the one it supports
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/output

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    # one publish at a time, so pushing to the builds branch never races
    concurrency:
      group: build-apk-${{ github.ref_type }}
      cancel-in-progress: false
    permissions:
      contents: write # pushes the builds branch (with its own token, below)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 = what F-Droid's build server uses, so its rebuild of a release comes out byte-identical
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # Test builds are signed with the one debug key kept in the DEBUG_KEYSTORE_BASE64 secret, so each build updates
      # the "Tally Dev" already installed. Without the secret (a fork) the build still runs with a throwaway key, and
      # nothing is published to the builds branch.
      - name: Debug signing key
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: this test build is signed with a throwaway key and not published"
          fi
      # The release variant is built too, signed exactly like a real release but with a throwaway key made for this run
      # (RSA 4096, SHA-384, like the release key), so the F-Droid job can check it's reproducible before any release.
      - name: Build
        run: |
          export TALLY_KEYSTORE="$RUNNER_TEMP/throwaway.p12" TALLY_KEYSTORE_PASSWORD=throwaway
          keytool -genkeypair -keystore "$TALLY_KEYSTORE" -storetype PKCS12 -storepass "$TALLY_KEYSTORE_PASSWORD" \
            -alias tally -keyalg RSA -keysize 4096 -sigalg SHA384withRSA -validity 1 -dname "CN=Tally CI throwaway"
          gradle assembleDebug assembleRelease --no-daemon
          rm -f "$TALLY_KEYSTORE"
      # exactly Tally's languages in the APK besides English (the default folder, '--_--'): one per values-xx folder
      # with a lang.xml, none of the libraries' own, none dropped by the build (resourceConfigurations, app/build.gradle)
      - name: Check the APK's languages
        run: |
          want=$(ls -d app/src/main/res/values-*/lang.xml 2>/dev/null | wc -l)
          line=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep '^locales:')
          echo "$line"
          got=$(echo "$line" | grep -o "'[^']*'" | grep -vc "'--_--'" || true)
          [ "$got" = "$want" ] || { echo "::error::the APK has $got languages, Tally has $want"; exit 1; }
      - name: Remove the debug key
        if: always()
        run: rm -f app/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: Tally-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: app/build/outputs/apk/release/app-release.apk
      # Keeps the latest debug APK of every branch on the `builds` branch (a single commit, replaced each time),
      # so it can be downloaded without unzipping an artifact: builds/Tally-<branch>.apk
      - name: Publish APK to the builds branch
        if: github.ref_type == 'branch' && steps.debugkey.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_BRANCH: ${{ github.ref_name }}
        run: |
          name="Tally-$(printf '%s' "$SRC_BRANCH" | tr -c 'A-Za-z0-9._-' '-').apk"
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          dir="$RUNNER_TEMP/builds"
          rm -rf "$dir" && mkdir "$dir" && cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin builds; then git checkout -q FETCH_HEAD -- . ; fi
          cp "$apk" "$name"
          printf '%s  %s  %s\n' "$name" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > "$name.txt"
          git add -A
          git commit -q -m "APKs (latest: $SRC_BRANCH @ ${GITHUB_SHA::7})"
          git push -q -f origin HEAD:builds

  # Builds this commit exactly the way F-Droid will: in F-Droid's own build-server image, with fdroidserver and our recipe
  # (docs/fdroid/app.tally.expenses.yml), scanner included. The recipe's Binaries/AllowedAPKSigningKeys make fdroid
  # compare its build with our signed APK and fail on any difference; that's what lets F-Droid ship our signature. The
  # reference is the published release APK when this commit is the release's tag, else the build job's throwaway-signed
  # one. The committed recipe itself must also pass fdroid lint.
  fdroid:
    name: F-Droid reproducible build
    needs: [build, release]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-check
          path: /tmp/check
      - name: fdroid lint, then fdroid build + compare
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: .github/fdroid-check.sh

  # Publishes a GitHub Release, signed with the private release key, whenever main (or a pushed tag vX.Y.Z) carries a
  # version that has no release yet. So releasing is: bump tallyVersion + tallyVersionCode, add the CHANGELOG.md section
  # and the fastlane changelog in a PR, and merge it.
  # On any other branch carrying such a version (the release PR's), it makes a preview instead, for the maintainer to
  # install over the current release before merging: the same APK, signed with the release key, as a draft release
  # (seen only by people with write access; a draft has no tag, so F-Droid never sees it). Its versionCode is one below
  # the release's: Android installs it over the current release (the same versionCode is allowed, a lower one isn't),
  # and the release then updates over it as it does for everyone.
  release:
    name: Signed release
    needs: check
    runs-on: ubuntu-latest
    # one at a time per branch, so two pushes never race over the same release or preview
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # SHA-256 of the release signing certificate (public; also in README.md so people can verify their download)
      RELEASE_CERT_SHA256: 9db8c89c59480ed9c673d9b96ec3f082b2836b1ced0e07a7dd418bd18d2fac88
    permissions:
      contents: write # creates the release and its tag, or the preview draft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Is there a new version to release?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_KEYSTORE_PASSWORD != '' }}
        run: |
          version=$(sed -n 's/^tallyVersion=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tallyVersion=$version in gradle.properties"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          code=$(sed -n 's/^tallyVersionCode=//p' gradle.properties)
          [ -s "fastlane/metadata/android/en-US/changelogs/$code.txt" ] || { echo "::error::Add fastlane/metadata/android/en-US/changelogs/$code.txt (F-Droid's release notes)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            mode=release name=$version
          else
            mode=preview name="$version-preview.$GITHUB_RUN_NUMBER" code=$((code - 1))
            if [ "$HAS_KEY" != true ]; then
              echo "::warning::No release key in this repository's secrets: no preview of $version"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$code" -gt 0 ] || { echo "::error::tallyVersionCode is too low for a preview"; exit 1; }
          fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "EXPECT_NAME=$name" >> "$GITHUB_ENV"
          echo "EXPECT_CODE=$code" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 = what F-Droid's build server uses, so its rebuild of a release comes out byte-identical
          java-version: "21"
      - name: Install Android SDK packages
        if: steps.version.outputs.publish == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build the signed release APK
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          TALLY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$TALLY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          export TALLY_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TALLY_KEYSTORE"
          if [ "$MODE" = release ]; then
            gradle assembleRelease bundleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon -PtallyVersion="$EXPECT_NAME" -PtallyVersionCode="$EXPECT_CODE"
          fi
          rm -f "$TALLY_KEYSTORE"
      - name: Verify the APK
        if: steps.version.outputs.publish == 'true'
        run: |
          set -o pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt || { echo "::error::Not signed with the Tally release key"; exit 1; }
          "$tools/aapt" dump badging "$apk" | grep -qF "versionCode='$EXPECT_CODE' versionName='$EXPECT_NAME'" || { echo "::error::version isn't $EXPECT_NAME ($EXPECT_CODE)"; exit 1; }
          if "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q debuggable; then
            echo "::error::The release APK is debuggable"
            exit 1
          fi
      # only the newest preview is kept, and a release's previews go once it is out
      - name: Remove earlier previews
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("preview-"))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          if [ "$MODE" = release ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/previews" 2> /dev/null || true
          fi
      - name: Publish the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="Tally-v$EXPECT_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          # the notes are this version's section of CHANGELOG.md, plus how to install (and verify)
          awk -v v="[$VERSION]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          if [ "$MODE" = preview ]; then
            # tagged "preview-…", never "v…": even if the draft were published, F-Droid's tag pattern wouldn't match it
            {
              echo
              echo "### Preview"
              echo "A preview of $VERSION for the maintainers to try before it is released. Back up first (Settings →"
              echo "Backup), then install \`$out\` over the current release: it keeps its data, and $VERSION updates over it."
            } >> notes.md
            gh release create "preview-$VERSION" "$out" "$out.sha256" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Tally $EXPECT_NAME (preview)" --notes-file notes.md
            exit 0
          fi
          # the bundle is what Google Play takes; same release (upload) key
          aab="Tally-$TAG.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          keytool -printcert -jarfile "$aab" | grep -qi "$(printf '%s' "$RELEASE_CERT_SHA256" | sed 's/../&:/g; s/:$//')" || { echo "::error::AAB not signed with the release key"; exit 1; }
          fp=$(printf '%s' "$RELEASE_CERT_SHA256" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo
            echo "### Install"
            echo "Download \`$out\` below on an Android 7.0+ phone and open it (allow installing from your browser or files app)."
            echo "Coming from a test build? Back up first (Settings → Backup), uninstall it, install this, then restore."
            echo
            echo "Signing certificate SHA-256: \`$fp\`"
          } >> notes.md
          # creates the tag at this commit when it doesn't exist yet
          gh release create "$TAG" "$out" "$out.sha256" "$aab" --target "$GITHUB_SHA" --title "Tally $VERSION" --notes-file notes.md
      # the preview for whoever ran this with preview_key (see the trigger above): encrypted to that key with a one-off
      # AES key, so nothing on the public previews branch can be installed by anyone else; releasing deletes the branch
      - name: Deliver the preview, encrypted
        if: steps.version.outputs.publish == 'true' && env.MODE == 'preview' && inputs.preview_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_KEY: ${{ inputs.preview_key }}
        run: |
          apk="Tally-v$EXPECT_NAME.apk"
          to="$RUNNER_TEMP/to.pem" key="$RUNNER_TEMP/aes.key" dir="$RUNNER_TEMP/previews"
          printf '%s' "$PREVIEW_KEY" | base64 -d > "$to"
          openssl pkey -pubin -in "$to" -noout || { echo "::error::preview_key isn't a public key"; exit 1; }
          rm -rf "$dir" && mkdir "$dir"
          openssl rand -hex 32 > "$key"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass "file:$key" -in "$apk" -out "$dir/Tally-preview.apk.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$to" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$key" -out "$dir/Tally-preview.key.enc"
          rm -f "$key"
          { echo "$EXPECT_NAME"; sha256sum "$apk"; echo "${GITHUB_SHA::7}"; } > "$dir/Tally-preview.txt"
          cd "$dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview $EXPECT_NAME (encrypted)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:previews
